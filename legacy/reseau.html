  const totC=sum(S.shifts.filter(x=>x.w===w),x=>durMin(x)/60*empById(x.emp).taux);
  const totCA=sum([0,1,2,3,4,5,6],d=>dayCA(d));
  return `<div class="pg-wrap"><table class="pg">${head}<tbody>${body}</tbody><tfoot>${foot.join('')}</tfoot></table></div>
   <div class="row wrap" style="justify-content:space-between;margin-top:10px">
     <div class="legend">${POSTE_ORDER.map(p=>`<span data-poste="${p}"><i></i>${POSTES[p].l}</span>`).join('')}${w===0?'<span><i style="background:#7CF0AE;border-radius:50%"></i>Pointé</span>':''}</div>
     <div class="muted tnum" style="font-size:13px">Semaine : <b>${dur(totH)}</b> planifiées${can.salaries?` · <b>${eur(totC,0)}</b> · ${pc(totC/totCA)} du CA prévu`:''}</div>
   </div>`;
}
function dayView(w,d){
  const can=CAN();
  const tabs=`<div class="seg" style="margin-bottom:12px" role="group" aria-label="Jour">${[0,1,2,3,4,5,6].map(i=>`<button data-act="plan-day" data-d="${i}" aria-pressed="${i===d}">${JC[i]} ${dateAt(w,i).getDate()}</button>`).join('')}</div>`;
  if(isClosed(d))return tabs+`<div class="panel"><div class="empty"><h3>Restaurant fermé</h3><p>Jour de fermeture hebdomadaire.</p></div></div>`;
  const H0=480,H1=1500,span=H1-H0;const X=m=>((m-H0)/span*100).toFixed(3)+'%';
  const today=w===0&&d===TIDX;const now=nowMin();
  const rush=`<span class="rush" style="left:${X(720)};width:${(120/span*100).toFixed(3)}%"></span><span class="rush" style="left:${X(1170)};width:${(120/span*100).toFixed(3)}%"></span>`;
  const hours=[];for(let h=8;h<=25;h++)hours.push(h);
  const headRow=`<div class="tl-row tl-head"><div></div><div class="track">${hours.map(h=>`<span style="left:${X(h*60)}">${pad(h%24)}h</span>`).join('')}</div></div>`;
  const P=UI.plan;
  const emps=EMP.filter(e=>(P.filter==='all'||e.poste===P.filter)&&(empShifts(e.id,w,d).length||absOf(e.id,w,d)));
  const rows=emps.map(e=>{
    const sh=empShifts(e.id,w,d);const ab=absOf(e.id,w,d);
    let real='';
    if(today){const ev=evsOn(e.id,TODAY_ISO);let open=null;ev.forEach(z=>{if(z.t==='in'||z.t==='back')open=z.m;else if(open!=null){real+=`<span class="real" style="left:${X(open)};width:${((z.m-open)/span*100).toFixed(3)}%"></span>`;open=null;}});if(open!=null&&now>open)real+=`<span class="real" style="left:${X(open)};width:${((now-open)/span*100).toFixed(3)}%"></span>`;}
    return `<div class="tl-row"><div class="who">${avatar(e,'s')}<span>${esc(e.prenom)}${ab?` · <span class="faint">${ABS[ab.type]}</span>`:''}</span></div><div class="track">${rush}${sh.map(x=>`<span class="bar" data-poste="${x.poste}" style="left:${X(sMin(x))};width:${((eMin(x)-sMin(x))/span*100).toFixed(3)}%" title="${x.s}–${x.e}">${x.s}–${x.e}</span>`).join('')}${real}${today&&now>=H0?`<span class="nowl" style="left:${X(now)}"></span>`:''}</div></div>`;
  }).join('');
  const slots=[];let mx=0;
  for(let m=H0;m<H1;m+=30){const mid=m+15;const n=new Set(shiftsWD(w,d).filter(x=>(P.filter==='all'||x.poste===P.filter||(P.filter==='salle'&&x.poste==='manager'))&&sMin(x)<=mid&&eMin(x)>mid).map(x=>x.emp)).size;slots.push({m,n});mx=Math.max(mx,n);}
  const bw=(30/span*100);
  const chart=`<div class="tl-row cov-chart" style="margin-top:14px"><div class="who" style="font-size:12px;color:var(--ink-2)">Personnes présentes<br><span class="faint" style="font-weight:500">prévu, par demi-heure</span></div><div class="track">${slots.map(s=>s.n?`<span class="cb" style="left:calc(${X(s.m)} + 1px);width:calc(${bw.toFixed(3)}% - 2px);height:${(s.n/(mx||1)*56).toFixed(1)}px" title="${hhmm(s.m)} : ${s.n} personne${s.n>1?'s':''}"></span>`:'').join('')}${slots.filter(s=>s.n===mx&&mx).slice(0,1).map(s=>`<span class="cl" style="left:calc(${X(s.m)} + ${(bw/2).toFixed(3)}%);bottom:${(56+3).toFixed(0)}px">${mx}</span>`).join('')}</div></div>`;
  const cv=coverage(w,d);
  const c=prevOf(d);
  const summary=`<div class="kpis" style="margin-bottom:12px">
    <div class="kpi"><div class="l">Couverts prévus</div><div class="v">${c[0]+c[1]}</div><div class="s">${c[0]} midi · ${c[1]} soir</div></div>
    <div class="kpi"><div class="l">Heures planifiées</div><div class="v">${dur(dayHours(w,d))}</div><div class="s">${nf((c[0]+c[1])/(dayHours(w,d)/60||1),1)} couverts / heure</div></div>
    <div class="kpi"><div class="l">Couverture ${infoBtn('couverture')}</div><div class="v" style="font-size:20px;margin-top:4px">${cv.map(x=>x.miss.length?`<span style="color:var(--warn)">${x.svc} ⚠</span>`:`<span style="color:var(--ok)">${x.svc} ✓</span>`).join(' · ')}</div><div class="s">${cv.filter(x=>x.miss.length).map(x=>x.miss.map(k=>`${k} ${x.have[k]}/${x.need[k]} (${x.svc})`).join(', ')).join(' · ')||'Effectif suffisant aux coups de feu'}</div></div>
    ${can.salaries?`<div class="kpi"><div class="l">Masse salariale ${infoBtn('masse')}</div><div class="v">${pc(dayCost(w,d)/dayCA(d))}</div><div class="s">${eur(dayCost(w,d),0)} pour ${eur(dayCA(d),0)} de CA</div></div>`:''}
  </div>`;
  return tabs+summary+`<div class="dayv"><div class="dayv-in">${headRow}${rows||'<p class="faint" style="padding:16px 0">Personne de planifié.</p>'}${chart}
    <div class="tl-legend"><span><i class="rush"></i>Coup de feu</span>${today?'<span><i></i>Présence réelle (pointage)</span><span><i class="nowi"></i>Maintenant</span>':''}</div></div></div>`;
}

function smSummary(){
  const x=SM.x;const e=empById(x.emp);
  if(!/^\d\d:\d\d$/.test(x.s)||!/^\d\d:\d\d$/.test(x.e))return `<div class="sm-sum"><span class="bad">Heures incomplètes.</span></div>`;
  const dm=durMin(x);
  const others=empShifts(x.emp,x.w,x.d).filter(s=>s.id!==SM.id);
  const dayTot=sum(others,durMin)+dm;
  const wk=empWeekMin(x.emp,x.w)-(SM.id?durMin(S.shifts.find(s=>s.id===SM.id)):0)+dm;
  const lines=[`<span><b>${dur(dm)}</b> de travail${x.p?` (pause de ${x.p} min déduite)`:''} · ${dur(dayTot)} sur la journée · ${dur(wk)} sur la semaine pour ${e.contrat} h de contrat</span>`];
  if(dm+(x.p||0)>360&&!x.p)lines.push(`<span class="warn">Plus de 6 h d’affilée : ajoute 20 min de pause.</span>`);

function myHistory(emp){
  const rows=[];
  for(let k=0;k<7;k++){

    rows.push(`<tr><td><b>${k===0?'Aujourd’hui':JOURS[d]}</b> <span class="faint">${shortDate(date)}</span></td><td class="mono" style="font-size:12.5px">${sh.map(x=>x.s+'–'+x.e).join(' · ')||'—'}</td><td><div class="evs">${ev.map(z=>`<span class="ev ${z.t}">${z.t==='in'?'↘':z.t==='out'?'↗':'Ⅱ'} ${hhmm(z.m)}</span>`).join('')||'<span class="faint">—</span>'}</div></td><td class="r tnum">${dur(pm)}</td><td class="r tnum"><b>${dur(rm)}</b></td><td class="r tnum" style="color:${rm-pm>10?'var(--info)':rm-pm<-10?'var(--warn)':'var(--ink-3)'}">${k===0&&rm<pm?'en cours':(rm-pm>=0?'+':'')+dur(rm-pm)}</td></tr>`);

}

function showPointConfirm(empId,type,m,byManager){
  const e=empById(empId);const sh=todayShifts(empId);const ev=evsOn(empId,TODAY_ISO);
  let line='',tone='';
  if(type==='in'){
    const k=ev.filter(z=>z.t==='in').length-1;const x=sh[k];

      if(df<=-2){line=`En avance de ${dur(-df)} sur ${x.s}. Les minutes avant ${x.s} comptent si ton responsable les valide. `+infoBtn('avance');}

  else if(type==='pause')line='Bonne pause. Pense à pointer ton retour.';

function asmSave(){
  const d=clone(UI.asm.d);
  d.steps=(d.steps||[]).map(s=>s.trim()).filter(Boolean);
  d.n=d.n.trim();
  if(d.t==='prep'){delete d.pv;delete d.por;}else{delete d.yq;delete d.yu;d.por=Math.max(1,Math.round(d.por||1));}
  if(d.id){const i=S.recipes.findIndex(r=>r.id===d.id);if(i>=0){d.sales=S.recipes[i].sales;S.recipes[i]=d;}}

  const by={};
  items.forEach(i=>{const def=i.u==='pièce'||i.u==='botte'?Math.ceil(i.par-i.st):Math.ceil((i.par-i.st)*2)/2;const q=UI.stock.oq[i.id]!=null?+UI.stock.oq[i.id]:def;(by[i.f]=by[i.f]||[]).push({i,q});});
  return by;
}

function leonRules(){

function localAnswer(q){
  const s=q.toLowerCase();const can=CAN();
  if(/retard|pointé|présen|arriv/.test(s)){
    const late=EMP.filter(e=>presence(e.id).k==='late');
    const on=EMP.filter(e=>['present','pause'].includes(presence(e.id).k));
    return (late.length?`**${late.map(e=>e.prenom).join(', ')}** ${late.length>1?'sont':'est'} en retard : ${late.map(e=>presence(e.id).d).join(' ; ')}.`:'Personne n’est en retard pour l’instant.')+`\n\nSur place : ${on.map(e=>e.prenom).join(', ')||'personne'}.`;
  }
  if(/ratio|matière|food|marge|rentab|prix/.test(s)){
    if(!can.costs)return 'Les coûts et les marges sont réservés au patron et au responsable. Je peux te donner la composition ou les allergènes d’un plat.';
    const it=S.recipes.filter(r=>r.t!=='prep'&&r.pv).map(r=>({r,m:metrics(r)})).sort((a,b)=>b.m.ratio-a.m.ratio);
    const w=it[0];
    return `Ton ratio matière moyen est de **${pc(weightedFC())}** (objectif ${pc(S.target,0)}).\n\n- Le plus cher à produire : ${w.r.n}, ${pc(w.m.ratio)}. Prix conseillé : ${eur(suggestPrice(w.m.cost,S.target,w.m.tva))}.\n- Le ratio, c’est coût matière ÷ prix HT. Clique sur les « i » des fiches pour le détail.`;
  }
  if(/planning|semaine|heure|repos|sup/.test(s)){
    if(effRole()==='staff'){const e=empById(U.empId);return `Cette semaine tu as **${dur(empWeekMin(e.id,0))}** planifiées pour ${e.contrat} h au contrat.`;}
    const A=planAlerts(0);return A.length?`J’ai relevé ${A.length} point${A.length>1?'s':''} dans le planning :\n\n${A.slice(0,4).map(a=>'- '+a.t).join('\n')}`:'Le planning de la semaine est conforme.';
  }
  if(/stock|commande|rupture|manque/.test(s)){
    if(!can.stocks)return 'Les stocks sont gérés par le manager et le directeur.';
    const low=S.ingredients.filter(i=>{const x=stockStatus(i);return x&&x.k!=='ok';});
    return low.length?`${low.length} produits sous le seuil :\n\n${low.map(i=>`- ${i.n} : ${qtyFmt(i.st,i.u)}`).join('\n')}\n\nLes commandes sont prêtes dans Stocks & commandes.`:'Aucun produit sous le seuil.';
  }
  if(/allerg/.test(s)){
    const r=S.recipes.find(r=>s.includes(r.n.toLowerCase().split(' ')[0]));
    if(r)return `${r.n} contient : **${allergensOf(r).map(a=>ALLERG[a]).join(', ')||'aucun allergène réglementaire'}**.`;
    return 'Dis-moi le plat et je te donne ses allergènes.';
  }
  return 'Je fonctionne ici en mode démo sans connexion à l’IA : je sais répondre sur les retards, le planning, les ratios, les stocks et les allergènes. Ouvre la page dans Claude pour me poser n’importe quelle question.';
}

function mdLite(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split(/\n/);
  let html='',inList=false;
  lines.forEach(l=>{const m=l.match(/^\s*[-•*]\s+(.*)/);if(m){if(!inList){html+='<ul>';inList=true;}html+='<li>'+m[1]+'</li>';}else{if(inList){html+='</ul>';inList=false;}if(l.trim())html+='<p>'+l+'</p>';}});
  if(inList)html+='</ul>';return html;
}

async function askLeon(q){
  q=q.trim();if(!q||CHAT_CTL)return;
  UI.chat.push({role:'user',content:q});
  const a={role:'assistant',content:'',pending:true};UI.chat.push(a);
  if(!AI){renderChat();setTimeout(()=>{a.content=localAnswer(q);a.pending=false;a.local=true;renderChat();},450);return;}
  const ctl=new AbortController();CHAT_CTL=ctl;renderChat();
  const hist=UI.chat.filter(m=>m!==a&&!m.pending&&!m.err&&m.content).slice(-8).map(m=>({role:m.role,content:m.content}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  const turns=[{role:'user',content:leonRules()},...hist];
  try{
    const res=await AI(turns,{cache:false,signal:ctl.signal,modelTier:'quick',onText:({text})=>{a.pending=false;a.content=text;const el=$('#chat-b .msg.a:last-child');if(el){el.classList.remove('pending');el.innerHTML=mdLite(text);const b=$('#chat-b');b.scrollTop=b.scrollHeight;}}});
    a.content=res.text;
  }catch(e){
    const code=e&&e.code;
    if(code==='cancelled')a.content=(e.text||'')+(e.text?'':'(arrêté)');
    else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){AI=null;a.content=localAnswer(q);a.local=true;}
    else if(code==='rate_limited')a.content=(e.text?e.text+'\n\n':'')+'Je suis très sollicité, réessaie dans un moment.';
    else if(code==='refused')a.content='Je préfère ne pas répondre à ça. Pose-moi une question sur le restaurant.';
    else{a.content=(e&&e.text?e.text+'\n\n':'')+'La connexion a coupé. Renvoie ta question.';a.err=!e||!e.text;}
  }finally{a.pending=false;CHAT_CTL=null;renderChat();}
}

 ni(t){UI.asm.newIng[t.dataset.f]=t.value;},
 'asm-step'(t){UI.asm.d.steps[+t.dataset.i]=t.value;},
 inv(t){const id=t.dataset.id;UI.stock.inv[id]=t.value;const i=ING(id);const has=t.value!=='';const e=has?+t.value-i.st:0;

/* =========================================================
   ÉCOUTEURS
   ========================================================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(POP&&!e.target.closest('.pop')&&(!t||t.dataset.act!=='info'))closeInfo();
  if(!t)return;
  if(t.disabled)return;
  const f=ACT[t.dataset.act];if(f)f(t,e);
});
document.addEventListener('input',e=>{const t=e.target.closest('[data-in]');if(t&&IN[t.dataset.in])IN[t.dataset.in](t,e);});
document.addEventListener('change',e=>{const t=e.target.closest('[data-ch]');if(t&&CH[t.dataset.ch])CH[t.dataset.ch](t,e);});
document.addEventListener('submit',e=>{if(e.target.id==='chat-f'){e.preventDefault();const i=$('#chat-in');if(i&&i.value.trim())askLeon(i.value);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(POP){closeInfo();return;}if(MODAL){closeModal();return;}if(UI.chatOpen){UI.chatOpen=false;renderChat();return;}}
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(PIN.ctx&&$('#pin-pad')){if(/^\d$/.test(e.key)){pinKey(e.key);e.preventDefault();}else if(e.key==='Backspace'){pinKey('B');e.preventDefault();}}
});
let DRAG=null;
document.addEventListener('dragstart',e=>{const t=e.target.closest&&e.target.closest('[data-drag]');if(!t)return;DRAG={id:t.dataset.drag};try{e.dataTransfer.effectAllowed='copyMove';e.dataTransfer.setData('text/plain',t.dataset.drag);}catch(err){}t.classList.add('dragging');});
function dragCopyMode(e){return ((UI.plan.dragMode||'move')==='copy')!==e.altKey;}
document.addEventListener('dragover',e=>{if(!DRAG)return;const c=e.target.closest&&e.target.closest('td[data-cell]');if(!c)return;e.preventDefault();try{e.dataTransfer.dropEffect=dragCopyMode(e)?'copy':'move';}catch(err){}$$('.drop-hi').forEach(x=>{if(x!==c)x.classList.remove('drop-hi');});c.classList.add('drop-hi');});
document.addEventListener('drop',e=>{if(!DRAG)return;const c=e.target.closest&&e.target.closest('td[data-cell]');if(!c)return;e.preventDefault();const x=S.shifts.find(s=>s.id===DRAG.id);const emp=c.dataset.emp,d=+c.dataset.d;
  if(x){const newPoste=x.emp!==emp?empById(emp).poste:x.poste;const reclass=newPoste!==x.poste?` · reclassé ${POSTES[newPoste].l}`:'';
    if(dragCopyMode(e)){S.shifts.push({...x,id:uid('s'),emp,d,poste:newPoste});toast(`Shift copié chez ${empById(emp).prenom}, ${JOURS[d].toLowerCase()}${reclass}`,'copy');}else{x.emp=emp;x.d=d;x.poste=newPoste;toast(`Shift déplacé : ${empById(emp).prenom}, ${JOURS[d].toLowerCase()}${reclass}`);}save();}
  DRAG=null;renderView();});
document.addEventListener('dragend',()=>{DRAG=null;$$('.drop-hi,.dragging').forEach(x=>x.classList.remove('drop-hi','dragging'));});
window.addEventListener('resize',closeInfo);
window.addEventListener('scroll',()=>{if(POP)closeInfo();},{passive:true});

   ========================================================= */
const NET={config:null,restos:{},configLoaded:false};
const STORE={mode:'loading',db:null};
const LAST={};
const LS='leon2:';
async function initStore(){
  let db=null;
  try{if(window.claude&&typeof window.claude.use==='function')db=await window.claude.use('db');}catch(e){db=null;}
  if(db){STORE.mode='db';STORE.db=db;}else STORE.mode='local';
}
function lsGet(path){try{const v=localStorage.getItem(LS+path);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(path,data){try{localStorage.setItem(LS+path,JSON.stringify(data));}catch(e){}}
function storeSet(path,data){if(STORE.mode==='db')return STORE.db.doc(path).set(data);lsSet(path,data);return Promise.resolve();}
function storeDel(path){if(STORE.mode==='db')return STORE.db.doc(path).delete();try{localStorage.removeItem(LS+path);}catch(e){}return Promise.resolve();}
function subDoc(path,cb){
  if(STORE.mode==='db'){
    try{return STORE.db.doc(path).onSnapshot(s=>cb(s.exists?s.data():null,s.metadata||{}),e=>onStoreErr(e));}catch(e){onStoreErr(e);return ()=>{};}
  }
  setTimeout(()=>cb(lsGet(path),{}),0);return ()=>{};
}
function subPointages(rid,cb){
  const since=isoD(addDays(TODAY,-15));
  if(STORE.mode==='db'){
    try{return STORE.db.collection(`restos/${rid}/pointages`).where('date','>=',since).onSnapshot(q=>cb(q.docs.filter(d=>!d.metadata||!d.metadata.hasPendingWrites).map(d=>d.data())),e=>onStoreErr(e));}catch(e){onStoreErr(e);return ()=>{};}
  }
  setTimeout(()=>{const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(LS+`restos/${rid}/pointages/`)){const v=JSON.parse(localStorage.getItem(k));if(v&&v.date>=since)out.push(v);}}}catch(e){}cb(out);},0);
  return ()=>{};
}
let ERR_SHOWN=false;
function onStoreErr(e){
  const code=e&&e.code;
  if(code==='quota_exceeded'){toast('La base de Léon est pleine : supprime d’anciennes données.','alert');return;}
  if(ERR_SHOWN)return;ERR_SHOWN=true;
  if(code==='revoked'||code==='not_granted')toast('Accès aux données partagées perdu. Recharge la page.','alert');
  else if(code==='invalid_argument')toast('Tu n’as pas le droit de modifier les données partagées sur cet appareil.','alert');
  else toast('Connexion à la base interrompue, nouvel essai en cours.','alert');
}
const WQ={};
function queueWrite(path,data){const q=WQ[path]||(WQ[path]={busy:false,data:null,t:null});q.data=data;clearTimeout(q.t);q.t=setTimeout(()=>flushW(path),220);}
async function flushW(path){const q=WQ[path];if(!q||q.busy)return;q.busy=true;while(q.data){const d=q.data;q.data=null;try{await storeSet(path,d);}catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await storeSet(path,d);}catch(e2){onStoreErr(e2);}}else onStoreErr(e);}}q.busy=false;}
const pendingW=path=>{const q=WQ[path];return !!(q&&(q.busy||q.data));};

 meta:{p:id=>`restos/${id}`,out:R=>{const o={};META_KEYS.forEach(k=>o[k]=R[k]);return o;},in:(R,d)=>{META_KEYS.forEach(k=>{if(d[k]!==undefined)R[k]=d[k];});}},
 planning:{p:id=>`restos/${id}/data/planning`,
   out:R=>({shifts:R.shifts.map(({w,...x})=>({...x,wk:wkIso(w)})),absences:R.absences.map(({w,...x})=>({...x,wk:wkIso(w)})),published:Object.fromEntries(Object.keys(R.published).filter(k=>R.published[k]).map(k=>[wkIso(k),true]))}),
   in:(R,d)=>{R.shifts=(d.shifts||[]).map(({wk,...x})=>({...x,w:wOf(wk)}));R.absences=(d.absences||[]).map(({wk,...x})=>({...x,w:wOf(wk)}));R.published={};Object.keys(d.published||{}).forEach(k=>{if(d.published[k])R.published[String(wOf(k))]=true;});}},
 carte:{p:id=>`restos/${id}/data/carte`,

   in:(R,d)=>{const cur={};R.ingredients.forEach(i=>cur[i.id]=i.st);R.ingredients=(d.ingredients||[]).map(i=>({...i,st:cur[i.id]!=null?cur[i.id]:(R.stockMap[i.id]!=null?R.stockMap[i.id]:0)}));R.recipes=d.recipes||[];}},
 stock:{p:id=>`restos/${id}/data/stock`,

 equipe:{p:id=>`restos/${id}/data/equipe`,

 dispo:{p:id=>`restos/${id}/live/dispo`,out:R=>({items:R.dispo}),in:(R,d)=>{R.dispo=d.items||{};}},

};
function ptOut(R,iso){const ev={};Object.keys(R.pointages).sort().forEach(e=>{const a=R.pointages[e][iso];if(a&&a.length)ev[e]=a;});return {date:iso,ev};}
const SUBS={};
function mountMeta(id){
  if(SUBS[id])return;
  NET.restos[id]=NET.restos[id]||blankResto(id);
  SUBS[id]={meta:subDoc(DOCS.meta.p(id),(d,m)=>onDoc(id,'meta',d,m))};
}
function mountFull(id){
  mountMeta(id);const R=NET.restos[id];if(R._full)return;R._full=true;
  ['planning','carte','stock','equipe','dispo','ventes'].forEach(k=>{SUBS[id][k]=subDoc(DOCS[k].p(id),(d,m)=>onDoc(id,k,d,m));});
  SUBS[id].pt=subPointages(id,list=>{
    const R2=NET.restos[id];if(!R2)return;
    list.forEach(x=>{const path=`restos/${id}/pointages/${x.date}`;if(pendingW(path))return;Object.keys(R2.pointages).forEach(e=>{if(R2.pointages[e][x.date])delete R2.pointages[e][x.date];});Object.keys(x.ev||{}).forEach(e=>{(R2.pointages[e]=R2.pointages[e]||{})[x.date]=x.ev[e];});LAST[path]=JSON.stringify(ptOut(R2,x.date));});
    R2._loaded.pt=true;scheduleRender();
  });
}
function unmount(id){const s=SUBS[id];if(s)Object.values(s).forEach(u=>{try{u&&u();}catch(e){}});delete SUBS[id];delete NET.restos[id];}
function onDoc(id,k,data,meta){
  const R=NET.restos[id];if(!R)return;
  const D=DOCS[k];const path=D.p(id);
  if(meta&&meta.hasPendingWrites)return;
  if(pendingW(path))return;
  if(data)D.in(R,data);
  R._loaded[k]=true;
  LAST[path]=JSON.stringify(D.out(R));
  if(R===S)syncCtx();
  scheduleRender();
}
function saveResto(R){
  if(!R)return;
  Object.keys(DOCS).forEach(k=>{
    if(!R._loaded[k])return;
    const D=DOCS[k];const path=D.p(R.id);const data=D.out(R);const js=JSON.stringify(data);
    if(LAST[path]===js)return;LAST[path]=js;queueWrite(path,data);
  });
  if(R._loaded.pt){
    for(let k=0;k<=15;k++){
      const iso=isoD(addDays(TODAY,-k));const path=`restos/${R.id}/pointages/${iso}`;const data=ptOut(R,iso);const js=JSON.stringify(data);
      if(LAST[path]===js)continue;
      if(LAST[path]===undefined&&!Object.keys(data.ev).length){LAST[path]=js;continue;}
      LAST[path]=js;queueWrite(path,data);
    }
  }
}
function save(){if(S)saveResto(S);}
function saveConfig(){const js=JSON.stringify(NET.config);if(LAST['net/config']===js)return;LAST['net/config']=js;queueWrite('net/config',NET.config);}
function subConfig(){
  subDoc('net/config',(d,m)=>{
    if(m&&m.hasPendingWrites)return;if(pendingW('net/config'))return;
    NET.configLoaded=true;
    if(d){NET.config=d;LAST['net/config']=JSON.stringify(d);(d.restos||[]).forEach(id=>{mountMeta(id);if(U.role==='admin')mountFull(id);});Object.keys(NET.restos).forEach(id=>{if(!(d.restos||[]).includes(id)&&!(S&&S.id===id))unmount(id);});}
    else NET.config=null;
    if(U.screen==='boot')U.screen=NET.config?'lock':'setup',render();
    else scheduleRender();
  });
}
let RT=null,DIRTY=false;
function scheduleRender(){
  clearTimeout(RT);
  RT=setTimeout(()=>{
    if(U.screen==='lock'||U.screen==='boot')return;
    if(U.screen!=='app')return;
    const a=document.activeElement;const typing=a&&['input','textarea','select'].includes((a.tagName||'').toLowerCase())&&!a.closest('.chat');
    if(MODAL||POP||typing||DRAG){DIRTY=true;return;}

}
function syncCtx(){if(!S)return;EMP=S.emp||[];RESTO={nom:S.nom,type:S.type,ville:S.ville};}
function withCtx(R,fn){const pS=S,pE=EMP,pR=RESTO;S=R;EMP=R.emp||[];RESTO={nom:R.nom,type:R.type,ville:R.ville};try{return fn();}finally{S=pS;EMP=pE;RESTO=pR;}}

function routeCode(code){
  if(!NET.config)return null;
  if(code===NET.config.adminCode)return {role:'admin'};
  for(const R of restoList()){
    if(R.codes&&R.codes.patron===code)return {role:'patron',rid:R.id};
    const e=(R.emp||[]).find(x=>x.code===code);
    if(e)return {role:e.acces==='manager'?'manager':'staff',rid:R.id,empId:e.id};
  }
  return null;
}
function allCodes(exceptKey){
  const out=new Set();if(NET.config&&exceptKey!=='admin')out.add(NET.config.adminCode);
  restoList().forEach(R=>{if(exceptKey!=='patron:'+R.id&&R.codes&&R.codes.patron)out.add(R.codes.patron);(R.emp||[]).forEach(e=>{if(exceptKey!=='emp:'+e.id&&e.code)out.add(e.code);});});
  return out;
}
function freeCode(start){const used=allCodes();let n=start||3001;while(used.has(String(n).padStart(4,'0'))&&n<9999)n++;return String(n).padStart(4,'0');}
function isManagerCode(c){return c===NET.config.adminCode||(S&&S.codes&&c===S.codes.patron)||EMP.some(x=>x.acces==='manager'&&x.code===c);}

function liveStats(){
  const tickets=S.ventes||[];let caHT=0,caTTC=0,cost=0,items=0;const by={};
  tickets.forEach(t=>(t.lines||[]).forEach(l=>{
    const r=REC(l.rid);const tva=(l.tva!=null?l.tva:10)/100;const ht=l.q*l.pu/(1+tva);caHT+=ht;caTTC+=l.q*l.pu;
    const c=r?metrics(r).cost*l.q:0;cost+=c;items+=l.q;
    const o=by[l.rid]||(by[l.rid]={rid:l.rid,n:l.n,q:0,ht:0,cost:0});o.q+=l.q;o.ht+=ht;o.cost+=c;
  }));
  let msMin=0,ms=0;EMP.forEach(e=>{const m=workedMin(evsOn(e.id,TODAY_ISO),true);msMin+=m;ms+=m/60*(e.taux||0);});
  const st=EMP.map(e=>presence(e.id));
  const recs=S.recipes.filter(r=>r.t!=='prep');
  const off=recs.filter(r=>{const d=S.dispo[r.id];return d&&(d.off||d.n===0);});
  const low=recs.filter(r=>{const d=S.dispo[r.id];return d&&!d.off&&d.n!=null&&d.n>0&&d.n<=3;});
  const fc=caHT?cost/caHT:0;
  return {caHT,caTTC,tickets:tickets.length,cost,items,fc,fcTone:ratioTone(fc),ms,msMin,msr:caHT?ms/caHT:0,present:st.filter(s=>s.k==='present'||s.k==='pause').length,late:st.filter(s=>s.k==='late').length,planned:EMP.filter(e=>todayShifts(e.id).length).length,by:Object.values(by).sort((a,b)=>b.ht-a.ht),off,low,caPrev:isClosed(TIDX)?0:dayCA(TIDX)};
}

function consume(r,portions,sign,depth){
  depth=depth||0;const por=r.t==='prep'?(r.yq||1):(r.por||1);
  r.comps.forEach(c=>{const g=compGross(c)*portions/por;if(c.k==='i'){const i=ING(c.id);if(i&&!i.noStock)i.st=Math.max(0,+(i.st-sign*g).toFixed(3));}else{const p=REC(c.id);if(p&&depth<3)consume(p,g,sign,depth+1);}});
}
function touchDispo(rid,patch){const d=S.dispo[rid]={...(S.dispo[rid]||{}),...patch,by:me().prenom,at:nowMin()};if(d.n!=null&&d.n<=0){d.n=0;d.off=true;}return d;}
function sellLines(lines,sign){
  lines.forEach(l=>{const r=REC(l.rid);if(!r)return;consume(r,l.q,sign);const d=S.dispo[l.rid];if(d&&d.n!=null){const n=Math.max(0,d.n-sign*l.q);touchDispo(l.rid,{n,off:n===0?true:(sign<0?false:d.off)});}});
}

/* historique des ventes (30 jours) */
function subVentesHist(rid,cb){
  const since=isoD(addDays(TODAY,-30));
  if(STORE.mode==='db'){
    try{return STORE.db.collection(`restos/${rid}/ventes`).where('date','>=',since).onSnapshot(q=>cb(q.docs.map(d=>d.data())),e=>onStoreErr(e));}catch(e){onStoreErr(e);return ()=>{};}
  }
  setTimeout(()=>{const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(LS+`restos/${rid}/ventes/`)){const v=JSON.parse(localStorage.getItem(k));if(v&&v.date>=since)out.push(v);}}}catch(e){}cb(out);},0);
  return ()=>{};
}
function mountFull(id){
  mountMeta(id);const R=NET.restos[id];if(R._full)return;R._full=true;
  ['planning','carte','stock','equipe','dispo','ventes'].forEach(k=>{SUBS[id][k]=subDoc(DOCS[k].p(id),(d,m)=>onDoc(id,k,d,m));});
  SUBS[id].pt=subPointages(id,list=>{
    const R2=NET.restos[id];if(!R2)return;
    list.forEach(x=>{const path=`restos/${id}/pointages/${x.date}`;if(pendingW(path))return;Object.keys(R2.pointages).forEach(e=>{if(R2.pointages[e][x.date])delete R2.pointages[e][x.date];});Object.keys(x.ev||{}).forEach(e=>{(R2.pointages[e]=R2.pointages[e]||{})[x.date]=x.ev[e];});LAST[path]=JSON.stringify(ptOut(R2,x.date));});
    R2._loaded.pt=true;scheduleRender();
  });
  SUBS[id].hist=subVentesHist(id,list=>{const R2=NET.restos[id];if(!R2)return;R2.hist={};list.forEach(x=>{if(x&&x.date)R2.hist[x.date]=x.tickets||[];});scheduleRender();});
}

function subConfig(){
  subDoc('net/config',(d,m)=>{
    if(m&&m.hasPendingWrites)return;if(pendingW('net/config'))return;
    NET.configLoaded=true;
    if(d){NET.config=d;LAST['net/config']=JSON.stringify(d);(d.restos||[]).forEach(id=>{mountMeta(id);if(U.role==='admin')mountFull(id);});Object.keys(NET.restos).forEach(id=>{if(!(d.restos||[]).includes(id)&&!(S&&S.id===id))unmount(id);});}

      if(!NET.config)U.screen='setup';
      else if(DEVICE&&DEVICE.rid&&(NET.config.restos||[]).includes(DEVICE.rid)){U.lockRid=DEVICE.rid;U.screen='lock';mountFull(DEVICE.rid);}
      else if(DEVICE&&DEVICE.admin)U.screen='lock';

function routeCode(code){
  if(!NET.config)return null;
  if(code===NET.config.adminCode)return U.lockRid?{role:'admin',rid:U.lockRid}:{role:'admin'};
  const list=U.lockRid?[NET.restos[U.lockRid]].filter(Boolean):(DEVICE&&DEVICE.admin?[]:restoList());
  for(const R of list){
    if(R.codes&&R.codes.patron===code)return {role:'patron',rid:R.id};
    const e=(R.emp||[]).find(x=>x.code===code);
    if(e)return {role:e.acces==='manager'?'manager':'staff',rid:R.id,empId:e.id};
  }

}

function doLogin(id,pass,keep){
  id=String(id||'').trim().toLowerCase();pass=String(pass||'');
  const C=NET.config;if(!C)return 'Connexion aux données en cours, réessaie dans un instant.';
  const aId=String(C.adminId||C.adminName||'admin').toLowerCase();const aPass=C.adminPass||C.adminCode;
  if(id===aId&&pass===aPass){setDevice({admin:true},keep);loginAs({role:'admin'});return null;}
  const R=restoList().find(x=>x.login&&String(x.login.id).toLowerCase()===id);
  if(R&&pass===R.login.pass){setDevice({rid:R.id},keep);U.lockRid=R.id;U.screen='lock';mountFull(R.id);render();toast(`Appareil connecté à ${esc(R.nom)}`,'lock');return null;}
  return 'Identifiant ou mot de passe incorrect.';
}

/* ---------- ventes : top / flop ---------- */
function salesAgg(days){
  const since=isoD(addDays(TODAY,-(days-1)));
  const by={};
  S.recipes.filter(r=>r.t!=='prep').forEach(r=>{by[r.id]={rid:r.id,n:r.n,q:0,ht:0,cost:0};});
  const add=t=>(t.lines||[]).forEach(l=>{const o=by[l.rid]||(by[l.rid]={rid:l.rid,n:l.n,q:0,ht:0,cost:0});const r=REC(l.rid);const tva=(l.tva!=null?l.tva:10)/100;const ht=l.q*l.pu/(1+tva);o.q+=l.q;o.ht+=ht;o.cost+=r?metrics(r).cost*l.q:0;});
  (S.ventes||[]).forEach(add);
  Object.keys(S.hist||{}).forEach(d=>{if(d>=since&&d!==TODAY_ISO)(S.hist[d]||[]).forEach(add);});
  return Object.values(by).map(o=>({...o,marge:o.ht-o.cost}));
}
function topFlop(list,metric){
  const key=metric==='m'?'marge':'q';
  const s=list.slice().sort((a,b)=>b[key]-a[key]||b.ht-a.ht);
  const n=s.length;const nt=Math.min(10,Math.ceil(n/2)),nf2=Math.min(10,Math.floor(n/2));
  return {top:s.slice(0,nt),flop:s.slice(n-nf2).reverse()};
}

function tfList(items,metric,flop,showResto){

/* ---------- commandes, réception, stock théorique / réel ---------- */
const frDate=iso=>{if(!iso)return '—';const d=pdate(iso);const n=Math.round((d-TODAY)/864e5);return n===0?'aujourd’hui':n===1?'demain':n===-1?'hier':JC[(d.getDay()+6)%7].toLowerCase()+'. '+d.getDate()+' '+MC[d.getMonth()];};
const ORDER_ST={brouillon:{l:'Brouillon',tone:''},envoyee:{l:'Envoyée',tone:'info'},recue:{l:'Reçue conforme',tone:'ok'},recue_ecarts:{l:'Reçue avec écarts',tone:'warn'},annulee:{l:'Annulée',tone:''}};
const orderLate=o=>o.status==='envoyee'&&o.livraison&&o.livraison<TODAY_ISO;
const orderToday=o=>o.status==='envoyee'&&o.livraison===TODAY_ISO;
const linePu=l=>l.pu!=null?l.pu:((ING(l.id)||{}).p||0);
function orderTotal(o){return sum(o.lines||[],l=>l.q*linePu(l));}
function orderStatus(o){if(orderLate(o))return {l:'En retard',tone:'bad'};if(orderToday(o))return {l:'Arrive aujourd’hui',tone:'ok'};return ORDER_ST[o.status]||{l:o.status,tone:''};}
function supInfo(f){return (S.suppliers&&S.suppliers[f])||{};}
function supplierNames(){const s=new Set(S.ingredients.filter(i=>!i.noStock).map(i=>i.f));Object.keys(S.suppliers||{}).forEach(f=>s.add(f));return [...s].filter(Boolean).sort();}
function mvAdd(id,k,v){S.mv=S.mv||{};const m=S.mv[id]||(S.mv[id]={in:0,out:0});m[k]=+((m[k]||0)+v).toFixed(3);}
function consume(r,portions,sign,depth){
  depth=depth||0;const por=r.t==='prep'?(r.yq||1):(r.por||1);
  r.comps.forEach(c=>{const g=compGross(c)*portions/por;if(c.k==='i'){const i=ING(c.id);if(i&&!i.noStock&&!isConso(i)){i.st=Math.max(0,+(i.st-sign*g).toFixed(3));mvAdd(i.id,'out',sign*g);}}else{const p=REC(c.id);if(p&&depth<3)consume(p,g,sign,depth+1);}});
}
function orderSuggestions(){
  const pending=new Set();S.orders.filter(o=>o.status==='envoyee'||o.status==='brouillon').forEach(o=>o.lines.forEach(l=>pending.add(l.id)));
  const items=S.ingredients.filter(i=>!i.noStock&&(i.mn>0||i.par>0)&&i.st<i.mn&&!pending.has(i.id));
  const by={};
  items.forEach(i=>{const def=i.u==='pièce'||i.u==='botte'?Math.ceil(i.par-i.st):Math.ceil((i.par-i.st)*2)/2;const q=UI.stock.oq[i.id]!=null?+UI.stock.oq[i.id]:def;(by[i.f]=by[i.f]||[]).push({i,q});});
  return by;
}
function newOrder(f,lines){
  const sup=supInfo(f);const delai=sup.delai!=null?+sup.delai:1;
  const o={id:uid('o'),f,lines:lines.filter(l=>l.q>0).map(l=>({id:l.id,q:+l.q,pu:(ING(l.id)||{}).p||0})),status:'brouillon',created:TODAY_ISO,createdAt:nowMin(),by:me().prenom,livraison:isoD(addDays(TODAY,Math.max(0,delai))),note:''};
  S.orders=[...S.orders,o].slice(-80);return o;
}
function orderMail(o){
  const lines=o.lines.map(l=>{const i=ING(l.id)||{n:'?',u:'pièce'};return `- ${qtyFmt(l.q,i.u)}  ${i.n}`;}).join('\n');
  return `Objet : Commande ${S.nom} · livraison ${frDate(o.livraison)}\n\nBonjour,\n\nMerci de nous livrer ${o.livraison?'pour le '+longDate(pdate(o.livraison)).toLowerCase():'dès que possible'} :\n\n${lines}\n\n${o.note?o.note+'\n\n':''}Livraison : ${S.nom}${S.ville?', '+S.ville:''}.\nMerci de nous confirmer la commande.\n\n${me().prenom} · ${S.nom}`;
}
function viewStocks(){
  const t=UI.stock.tab;
  if(UI.stock.recv&&S.orders.some(o=>o.id===UI.stock.recv))return receptionHTML(S.orders.find(o=>o.id===UI.stock.recv));
  if(UI.stock.order&&S.orders.some(o=>o.id===UI.stock.order))return orderDetailHTML(S.orders.find(o=>o.id===UI.stock.order));
  const env=S.orders.filter(o=>o.status==='envoyee').length;

}

  return `<div class="kpis"><div class="kpi"><div class="l">Valeur du stock théorique</div><div class="v">${eur(val,0)}</div><div class="s">au prix d’achat HT</div></div><div class="kpi"><div class="l">Sous le seuil ${infoBtn('seuil')}</div><div class="v" style="color:${low.length?'var(--warn)':'inherit'}">${low.length}</div><div class="s">${low.slice(0,3).map(i=>esc(i.n.split(' (')[0])).join(', ')}${low.length>3?'…':''}</div></div><div class="kpi"><div class="l">Dernier inventaire ${infoBtn('inventaire')}</div><div class="v" style="color:${lastInv&&lastInv.ecart<0?'var(--bad)':'inherit'}">${lastInv?eur(lastInv.ecart):'—'}</div><div class="s">${lastInv?`écart réel − théorique · ${frDate(lastInv.date)} par ${esc(lastInv.by)}`:'Pas encore d’inventaire'}</div></div><div class="kpi"><div class="l">Livraisons attendues</div><div class="v">${S.orders.filter(o=>o.status==='envoyee').length}</div><div class="s">${S.orders.filter(orderToday).length} aujourd’hui · ${S.orders.filter(orderLate).length} en retard</div></div></div>
  ${low.length?`<div class="row wrap" style="margin-bottom:12px;justify-content:space-between"><span class="muted" style="font-size:13.5px">Léon a préparé les commandes pour ${low.length} produit${low.length>1?'s':''} sous le seuil.</span><button class="btn primary sm" data-act="stock-tab" data-t="cmd">${ic('truck','s')} Voir les commandes à passer</button></div>`:''}
  <section class="panel"><div class="panel-h"><h3>Produits liés aux ventes</h3><span class="faint" style="font-size:12.5px">Le théorique baisse à chaque vente, monte à chaque réception</span></div><div class="tbl-wrap"><table class="tbl">${head(false)}<tbody>${food.slice().sort((a,b)=>ord[stockStatus(a).k]-ord[stockStatus(b).k]||a.n.localeCompare(b.n)).map(i=>row(i,false)).join('')}</tbody></table></div></section>
  ${conso.length?`<section class="panel" style="margin-top:18px"><div class="panel-h"><h3>Consommables</h3><span class="faint" style="font-size:12.5px">Papier, entretien, emballages : pas liés aux ventes, suivis à l’inventaire et à la réception</span></div><div class="tbl-wrap"><table class="tbl">${head(true)}<tbody>${conso.map(i=>row(i,true)).join('')}</tbody></table></div></section>`:''}`;

  return `<p class="muted" style="margin:-6px 0 12px;font-size:13.5px;max-width:80ch">Compte ce que tu as vraiment. Léon compare avec le stock théorique (dernier comptage + réceptions − ventes) et chiffre l’écart. Un écart négatif = perte, casse, portion trop généreuse ou oubli de réception. ${infoBtn('inventaire')}</p>

  <section class="panel"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Produit</th><th class="r">Théorique</th><th class="r">Compté</th><th class="r">Écart</th><th class="r">Écart €</th></tr></thead><tbody>
  ${list.map(i=>{const v=inv[i.id];const has=v!=null&&v!=='';const e=has?+v-i.st:0;return `<tr><td><b>${esc(i.n)}</b>${isConso(i)?' <small class="faint">consommable</small>':''}</td><td class="r tnum">${qtyFmt(i.st,i.u)}</td><td class="r"><input class="tinp" type="number" min="0" step="0.1" value="${has?esc(v):''}" placeholder="${nf(i.st,1)}" data-in="inv" data-id="${i.id}" aria-label="Quantité comptée de ${esc(i.n)}"> <span class="faint">${unitShort(i.u)}</span></td><td class="r tnum" id="inv-e-${i.id}">${has?(e>=0?'+':'')+nf(e,2):'—'}</td><td class="r tnum" id="inv-v-${i.id}" style="color:${has&&e<0?'var(--bad)':'inherit'}">${has?eur(e*i.p):'—'}</td></tr>`;}).join('')}
  </tbody><tfoot><tr><td>Écart total (produits comptés)</td><td></td><td></td><td></td><td class="r" id="inv-tot" style="color:${tot<0?'var(--bad)':'inherit'}">${eur(tot)}</td></tr></tfoot></table></div></section>

function recPill(l){const m={ok:['ok','Conforme'],manquant:['bad','Manquant'],partiel:['warn','Partiel'],surplus:['info','En plus'],abime:['bad','Refusé (abîmé)'],prix:['warn','Prix différent']};const x=m[l.rs]||['','—'];return `<span class="pill ${x[0]}">${x[1]}</span>`;}
function recAuto(l,c){if(c.rs==='abime')return 'abime';const qr=+c.qr;if(!(qr>0))return 'manquant';if(qr<l.q-1e-6)return 'partiel';if(qr>l.q+1e-6)return 'surplus';if(Math.abs((+c.pr)-linePu(l))>0.004)return 'prix';return 'ok';}

   o.lines=o.lines.map((l,k)=>{const c=R.lines[k];const pu=linePu(l);const qr=c.rs==='abime'?0:Math.max(0,+c.qr||0);const pr=+c.pr>=0?+c.pr:pu;const rs=recAuto(l,{...c,qr,pr});

/* ---------- aides ---------- */
const frLongDate=iso=>{if(!iso)return '—';const d=pdate(iso);return d.getDate()+' '+MC[d.getMonth()]+' '+d.getFullYear();};
function hygDayTemp(eqId){
  const list=(S.hyg.temps||[]).filter(t=>t.eq===eqId&&t.date===TODAY_ISO);
  return list.length?list[list.length-1]:null;
}
function hygBad(eq,val){return val<eq.min||val>eq.max;}
function lotEffDlc(lot){
  if(lot.statut!=='ouvert')return lot.dlc||null;
  const short=isoD(addDays(pdate(lot.dateOuverture||TODAY_ISO),3));
  return lot.dlc&&lot.dlc<short?lot.dlc:short;
}
function printLabel({nom,dlc,sub}){
  const box=document.getElementById('print-label');if(!box)return;
  box.innerHTML=`<div class="label-card"><div class="lb-top">Léon · ${esc(S.nom)}</div><div class="lb-prod">${esc(nom)}</div>${sub?`<div class="lb-sub">${esc(sub)}</div>`:''}<div class="lb-bc"></div><div class="lb-dlc">À consommer avant le<br><b>${dlc?frLongDate(dlc):'—'}</b></div><div class="lb-foot">Imprimé le ${frLongDate(TODAY_ISO)} par ${esc(me().prenom)}</div></div>`;
  setTimeout(()=>{try{window.print();}catch(e){toast('Impression indisponible dans cet aperçu','alert');}},60);
}

function hygTempBoard(){
  const eqs=S.hyg.equip||[];
  const rows=eqs.map(eq=>{
    const t=hygDayTemp(eq.id);
    const v=UI.hyg.entry[eq.id]!=null?UI.hyg.entry[eq.id]:'';
    return `<tr><td><b>${esc(eq.nom)}</b><br><small class="faint">${(HYG_TYPES[eq.type]||HYG_TYPES.autre).l} · cible ${eq.min} à ${eq.max} °C</small></td>
     <td class="r">${t?`<span class="tnum ${hygBad(eq,t.val)?'tf-v bad':''}">${nf(t.val,1)} °C</span><br><small class="faint">${hhmm(t.ts)} · ${esc(t.who)}</small>`:'<span class="faint">Pas encore relevé</span>'}</td>
     <td class="r"><input class="tinp" type="number" step="0.1" placeholder="°C" value="${esc(v)}" data-in="hyg-temp" data-id="${eq.id}" style="width:90px" aria-label="Nouveau relevé pour ${esc(eq.nom)}"></td>
     <td id="hyg-st-${eq.id}">${hygEntryPill(eq,v)}</td></tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Appareil</th><th class="r">Relevé d’aujourd’hui</th><th class="r">Nouveau relevé</th><th>Statut</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="faint">Aucun appareil configuré.</td></tr>'}</tbody></table></div>`;
}
function hygEntryPill(eq,v){
  if(v==null||v==='')return '<span class="faint">—</span>';
  return hygBad(eq,+v)?`<span class="pill bad">${ic('alert','s')} Hors norme</span>`:`<span class="pill ok">${ic('check','s')} OK</span>`;
}

/* ---------- alertes ---------- */
function extraAlerts(){
  if(!S||!CAN().stocks)return [];
  const A=[];
  S.orders.filter(orderLate).forEach(o=>A.push({tone:'bad',ic:'truck',t:`Livraison ${o.f} en retard`,s:`Prévue ${frDate(o.livraison)}, pas encore réceptionnée.`,acts:[{l:'Réceptionner',act:'ord-recv',id:o.id}]}));
  S.orders.filter(orderToday).forEach(o=>A.push({tone:'info',ic:'truck',t:`Livraison ${o.f} attendue aujourd’hui`,s:`${o.lines.length} produits · ${eur(orderTotal(o),0)} HT. Contrôle-la produit par produit à l’arrivée.`,acts:[{l:'Réceptionner',act:'ord-recv',id:o.id,primary:true}]}));
  S.orders.filter(o=>o.avoirStatus==='a_demander').slice(0,2).forEach(o=>A.push({tone:'brass',ic:'euro',t:`Avoir à demander à ${o.f} : ${eur(o.avoir)}`,s:'Manquants ou écarts de prix constatés à la réception.',acts:[{l:'Voir',act:'ord-open',id:o.id}]}));
  const last=(S.invHist||[]).slice(-1)[0];if(last&&last.ecart<-20&&last.date>=isoD(addDays(TODAY,-7)))A.push({tone:'warn',ic:'box',t:`Inventaire : ${eur(last.ecart)} d’écart`,s:`Entre le stock théorique et le réel, ${frDate(last.date)}. ${last.lines.slice().sort((a,b)=>a.val-b.val).slice(0,2).filter(l=>l.val<0).map(l=>l.n+' '+eur(l.val)).join(', ')}.`,acts:[{l:'Voir',act:'goto-stock',t:'inv'}]});
  if(S.hyg){
    const eqs=S.hyg.equip||[];
    const byEq={};(S.hyg.temps||[]).filter(t=>t.date===TODAY_ISO).forEach(t=>{if(!byEq[t.eq]||t.ts>byEq[t.eq].ts)byEq[t.eq]=t;});
    eqs.filter(eq=>byEq[eq.id]&&hygBad(eq,byEq[eq.id].val)).slice(0,2).forEach(eq=>{const t=byEq[eq.id];A.push({tone:'bad',ic:'thermo',t:`${eq.nom} : ${nf(t.val,1)} °C, hors norme`,s:`Doit rester entre ${eq.min} et ${eq.max} °C. Relevé à ${hhmm(t.ts)} par ${esc(t.who)}.`,acts:[{l:'Voir',act:'nav',v:'hygiene'}]});});
    const missing=eqs.filter(eq=>!byEq[eq.id]);
    if(missing.length&&nowMin()>=660)A.push({tone:'info',ic:'thermo',t:`Relevé de température : ${missing.length}/${eqs.length} appareil${missing.length>1?'s':''} pas encore vérifié${missing.length>1?'s':''}`,s:missing.slice(0,3).map(e=>e.nom).join(', ')+(missing.length>3?'…':''),acts:[{l:'Relever',act:'nav',v:'hygiene'}]});
    const lots=(S.hyg.lots||[]).map(l=>({l,eff:lotEffDlc(l)})).filter(x=>x.eff&&x.eff<=isoD(addDays(TODAY,1)));
    if(lots.length){
      const exp=lots.filter(x=>x.eff<TODAY_ISO).length,soon=lots.length-exp;
      A.push({tone:exp?'bad':'warn',ic:'box',t:`${lots.length} DLC à vérifier aujourd’hui`,s:[exp?`${exp} dépassée${exp>1?'s':''} : à retirer de la vente`:null,soon?`${soon} à utiliser aujourd’hui en priorité`:null].filter(Boolean).join(' · '),acts:[{l:'Voir la liste',act:'nav',v:'hygiene'}]});
    }
  }
  return A;
}

      case 'pointage':{

      case 'recettes':{

      case 'hygiene':{

        return {s:`${done}/${eqs.length} relevés aujourd’hui${hors?' · '+hors+' hors norme':''}${dlc?' · '+plur(dlc,'DLC à surveiller','DLC à surveiller'):''}`,n:hors+dlc,tone:hors?'bad':'warn'};}

/* ---------- historique : retour in-app + geste retour du navigateur ---------- */
const NAVH={stack:[],cur:null,u:null,sid:0,depth:0,ok:true,self:0,selfAt:0,y:0,restoring:false,hold:false,crumbs:[]};
window.addEventListener('scroll',()=>{NAVH.y=window.scrollY;},{passive:true});
function navSnap(){
  const v=UI.view;const s={rid:S?S.id:null,v};
  if(v==='recettes'){s.sel=UI.rec.sel&&REC(UI.rec.sel)?UI.rec.sel:null;s.tab=UI.rec.tab;}
  else if(v==='stocks'){s.order=UI.stock.order||null;s.recv=UI.stock.recv||null;s.tab=UI.stock.tab;}
  else if(v==='pointage')s.tab=UI.point.tab;
  else if(v==='planning')s.mode=UI.plan.mode;
  else if(v==='hygiene')s.tab=UI.hyg?UI.hyg.tab:'temp';
  else if(v==='assembleur')s.asm=(UI.asm&&UI.asm.d&&UI.asm.d.id)||'new';
  return s;
}
const navKey=s=>[s.rid,s.v,s.sel||'',s.order||'',s.recv||'',s.asm||''].join('|');
function histPush(){if(!NAVH.ok)return;try{history.pushState({leon:NAVH.sid},'');NAVH.depth++;}catch(e){NAVH.ok=false;}}
function histBack(n){
  n=Math.min(n||1,NAVH.depth);if(!NAVH.ok||n<=0)return;
  NAVH.depth-=n;NAVH.self++;NAVH.selfAt=Date.now();
  try{history.go(-n);}catch(e){NAVH.ok=false;NAVH.self=0;}
}
function navReset(){histBack(NAVH.depth);NAVH.stack=[];NAVH.cur=null;NAVH.sid++;}
function navTrack(){
  if(U.screen!=='app')return;
  if(NAVH.u!==U){NAVH.u=U;NAVH.stack=[];NAVH.cur=null;NAVH.sid++;NAVH.y=0;requestAnimationFrame(()=>window.scrollTo(0,0));}
  if(NAVH.hold)return;
  const s=navSnap();const k=navKey(s);
  if(!NAVH.cur||NAVH.restoring){NAVH.cur={s,k};return;}
  if(k===NAVH.cur.k){NAVH.cur.s=s;return;}
  const top=NAVH.stack[NAVH.stack.length-1];
  if(top&&top.k===k){NAVH.stack.pop();NAVH.cur={s,k};histBack(1);const y=top.y||0;requestAnimationFrame(()=>window.scrollTo(0,y));return;}
  NAVH.stack.push({s:NAVH.cur.s,k:NAVH.cur.k,y:NAVH.y});NAVH.cur={s,k};
  if(NAVH.stack.length>80)NAVH.stack.shift();
  histPush();
}
function navApply(s){
  if(s.rid!==(S?S.id:null)){
    if(U.role!=='admin')return;
    if(!s.rid){S=null;U.rid=null;U.viewAs=null;U.empId=null;UI.view='hub';render();return;}
    if(!NET.restos[s.rid])return;
    mountFull(s.rid);S=NET.restos[s.rid];U.rid=s.rid;U.viewAs=null;U.empId=null;syncCtx();
    UI.rec={tab:'fiches',cat:'all',q:'',sel:null,sim:null};UI.plan={w:0,mode:'semaine',day:TIDX,filter:'all'};UI.point={tab:'jour',rw:0};UI.stock={tab:'stock',inv:{},oq:{}};UI.asm=null;UI.sim={lines:{}};
  }
  UI.view=s.v;
  if(s.v==='recettes'){UI.rec.sel=s.sel||null;UI.rec.sim=null;if(s.tab)UI.rec.tab=s.tab;}
  else if(s.v==='stocks'){UI.stock.order=s.order||null;UI.stock.recv=s.recv||null;if(!s.recv)UI.rc=null;if(s.tab)UI.stock.tab=s.tab;}
  else if(s.v==='pointage'&&s.tab)UI.point.tab=s.tab;
  else if(s.v==='planning'&&s.mode)UI.plan.mode=s.mode;
  else if(s.v==='hygiene'&&s.tab){if(!UI.hyg)UI.hyg={tab:'temp',entry:{},quick:{n:'',d:isoD(addDays(TODAY,3))}};UI.hyg.tab=s.tab;}
  else if(s.v==='assembleur'&&!UI.asm)UI.view='recettes';
  render();
}
function navPop(){
  const top=NAVH.stack.pop();if(!top)return false;
  NAVH.restoring=true;try{navApply(top.s);}finally{NAVH.restoring=false;}
  const y=top.y||0;requestAnimationFrame(()=>window.scrollTo(0,y));
  return true;
}
function navBack(){
  navGuard(()=>{
    if(NAVH.stack.length){histBack(1);navPop();return;}
    const C=navCrumbs();const p=C[C.length-2];if(p&&p.go)p.go();
  });
}
window.addEventListener('popstate',()=>{
  if(NAVH.self>0){NAVH.self--;if(Date.now()-NAVH.selfAt<2500)return;NAVH.self=0;}
  NAVH.depth=Math.max(0,NAVH.depth-1);
  if(U.screen!=='app')return;
  if(POP||MODAL||UI.chatOpen){
    if(POP)closeInfo();else if(MODAL)closeModal();else{UI.chatOpen=false;if(CHAT_CTL)CHAT_CTL.abort();renderChat();}
    histPush();return;
  }
  if(asmDirty()){histPush();navGuard(()=>{histBack(1);navPop();});return;}
  if(!NAVH.stack.length)return;
  if(UI.view==='assembleur')UI.asm=null;
  navPop();
});

/* ---------- accueil : point de départ ---------- */
HOME_BLOCKS.raccourcis={t:'Accès rapide',full:true};
DEFAULT_LAYOUT.patron=['setup','kpis','raccourcis','alerts','topflop','commandes','carte','presence','ventes','annonces'];
DEFAULT_LAYOUT.manager=['setup','kpis','raccourcis','alerts','commandes','carte','presence','topflop','ventes','annonces'];
DEFAULT_LAYOUT.staff=['pointage','raccourcis','carte','semaine','checklist','annonces'];
function mergeLayout(base,saved){
  if(!saved)return base.map(k=>({k}));
  const out=saved.filter(b=>HOME_BLOCKS[b.k]&&base.includes(b.k));
  base.forEach((k,i)=>{
    if(out.some(b=>b.k===k))return;
    const prev=base.slice(0,i).reverse().find(p=>out.some(b=>b.k===p));
    out.splice(prev?out.findIndex(b=>b.k===prev)+1:0,0,{k});
  });
  return out;
}
function getLayout(role){const key=role==='admin'?'patron':role;return mergeLayout(DEFAULT_LAYOUT[key]||DEFAULT_LAYOUT.patron,(S&&S.layout&&S.layout[key])||null);}
function getLayoutFor(role){return mergeLayout(DEFAULT_LAYOUT[role],(S&&S.layout&&S.layout[role])||null);}
function tilesBlock(title){
  const items=navItems().filter(n=>n.v!=='accueil');
  if(!items.length)return '';
  return `<section class="quick"><h2 class="sec-t">${esc(title)}</h2><div class="tiles">${items.map(n=>{const x=modInfo(n.v);return `<button class="tile" data-act="go-mod" data-v="${n.v}"><span class="ti">${ic(n.i)}</span><span class="tt"><b>${esc(navLabel(n.v))}</b><small>${esc(x.s||'')}</small></span>${nbHTML(x)}<span class="go" aria-hidden="true">${ic('chevR','s')}</span></button>`;}).join('')}</div></section>`;
}
function kpisBlock(){
  const can=CAN(),k=liveStats();
  const ok=v=>navItems().some(n=>n.v===v);
  const K=(v,t,label,inner)=>ok(v)?`<div class="kpi click" data-act="go-mod" data-v="${v}"${t?` data-t="${t}"`:''} role="link" tabindex="0" title="${esc(label)}" aria-label="${esc(label)}">${inner}<span class="kgo" aria-hidden="true">${ic('chevR','s')}</span></div>`:`<div class="kpi">${inner}</div>`;
  return `<div class="kpis" style="margin-bottom:0">
    ${K('service','','Voir le service en direct',`<div class="l"><span class="live-dot"></span> CA du jour ${infoBtn('caReel')}</div><div class="v">${eur(k.caHT,0)}<small>HT</small></div><div class="s">${k.tickets} ticket${k.tickets>1?'s':''}${k.tickets?` · ticket moyen ${eur(k.caTTC/k.tickets)} TTC`:''}${k.caPrev?` · prévu ${eur(k.caPrev,0)}`:''}</div>${k.caPrev?`<div class="meter"><i style="width:${clamp(k.caHT/k.caPrev*100,0,100)}%"></i></div>`:''}`)}
    ${can.costs?K('recettes','analyse','Voir l’analyse de la carte',`<div class="l">Coût matière des ventes ${infoBtn('fcReel')}</div><div class="v">${k.caHT?pc(k.fc):'—'}</div><div class="s">${k.caHT?`${eur(k.cost,0)} d’ingrédients vendus · objectif ${pc(S.target,0)}`:'Pas encore de vente aujourd’hui'}</div>${k.caHT?`<div class="meter"><i class="${k.fcTone}" style="width:${clamp(k.fc/0.5*100,0,100)}%"></i><b style="left:${S.target/0.5*100}%"></b></div>`:''}`):''}
    ${can.salaries?K('pointage','jour','Voir les heures pointées',`<div class="l">Masse salariale en direct ${infoBtn('msLive')}</div><div class="v">${k.caHT?pc(k.msr):eur(k.ms,0)}</div><div class="s">${k.caHT?`${eur(k.ms,0)} d’heures pointées · `:''}${dur(k.msMin)} pointées aujourd’hui</div>${k.caHT?`<div class="meter"><i class="${k.msr<=0.32?'':k.msr<=0.36?'warn':'bad'}" style="width:${clamp(k.msr/0.5*100,0,100)}%"></i><b style="left:${0.32/0.5*100}%"></b></div>`:''}`)
      :K('pointage','jour','Voir le pointage',`<div class="l">Heures pointées</div><div class="v">${dur(k.msMin)}</div><div class="s">aujourd’hui, toute l’équipe</div>`)}
    ${K('pointage','jour','Voir les présences',`<div class="l">Équipe sur place</div><div class="v">${k.present}<small>/ ${k.planned}</small></div><div class="s">${k.late?`<span style="color:var(--bad);font-weight:600">${k.late} en retard</span>`:EMP.length?'personne en retard':'Équipe pas encore créée'}</div>`)}
  </div>`;
}
function ventesBlock(title){
  const can=CAN(),k=liveStats();
  const link=navItems().some(n=>n.v==='service')?`<button class="btn ghost sm" data-act="nav" data-v="service">Service ${ic('chevR','s')}</button>`:'';
  return panelBlock(title,link,k.by.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Produit</th><th class="r">Vendus</th><th class="r">CA HT</th>${can.costs?'<th class="r">Coût matière</th><th class="r">Marge</th>':''}</tr></thead><tbody>${k.by.map(o=>`<tr><td>${esc(o.n)}</td><td class="r tnum">${o.q}</td><td class="r tnum">${eur(o.ht)}</td>${can.costs?`<td class="r tnum">${eur(o.cost)}</td><td class="r tnum">${eur(o.ht-o.cost)}</td>`:''}</tr>`).join('')}</tbody>${can.costs?`<tfoot><tr><td>Total</td><td class="r">${k.items}</td><td class="r">${eur(k.caHT)}</td><td class="r">${eur(k.cost)}</td><td class="r">${eur(k.caHT-k.cost)}</td></tr></tfoot>`:''}</table></div>`:`<div class="empty"><h3>Aucune vente pour l’instant</h3><p>${S.caisse&&S.caisse.status==='connected'?'Les ventes de la caisse arrivent ici en direct.':'Les ventes arriveront ici dès que la caisse sera branchée.'}</p></div>`);
}
const ALERT_RANK={bad:0,warn:1,info:1,ok:2,brass:2};
function sortAlerts(A){return A.map((a,i)=>({a,i})).sort((x,y)=>((ALERT_RANK[x.a.tone]??1)-(ALERT_RANK[y.a.tone]??1))||x.i-y.i).map(x=>x.a);}
function blockHTML(b){
  const t=b.t||HOME_BLOCKS[b.k].t;const can=CAN();
  switch(b.k){
    case 'setup':return (can.settings||can.board)?setupCard():'';
    case 'kpis':return kpisBlock();
    case 'raccourcis':return tilesBlock(t);
    case 'alerts':{
      const A=sortAlerts(leonAlerts());const lim=5;const show=UI.homeAll?A:A.slice(0,lim);
      const more=A.length>lim?`<div class="more-row"><button class="btn ghost sm" data-act="alerts-more" aria-expanded="${!!UI.homeAll}">${UI.homeAll?'Réduire':'Voir les '+(A.length-lim)+' autres points'} ${ic(UI.homeAll?'up':'down','s')}</button></div>`:'';
      return panelBlock(t,`<span class="faint" style="font-size:12.5px">${A.length} point${A.length>1?'s':''}${A.length>lim&&!UI.homeAll?' · les plus urgents d’abord':''}</span>`,alertsHTML(show)+more);}
    case 'topflop':return topFlopBlock(t);
    case 'commandes':return can.stocks?cmdBlock(t):'';
    case 'carte':return carteBlock(t);
    case 'presence':return EMP.length?panelBlock(t,modOn('pointage')?`<button class="btn ghost sm" data-act="nav" data-v="pointage">Pointage ${ic('chevR','s')}</button>`:'',presenceList(can.board)):'';
    case 'ventes':return ventesBlock(t);
    case 'annonces':return panelBlock(t,can.board?`<button class="btn ghost sm" data-act="annonce-new">${ic('plus','s')} Poster</button>`:'',S.annonces.length?S.annonces.slice().reverse().map((a,i)=>`<div class="note"><small>${esc(a.from)} · ${esc(a.at)}${can.board?` · <button class="btn xs ghost" data-act="annonce-del" data-i="${S.annonces.length-1-i}">retirer</button>`:''}</small>${esc(a.m)}</div>`).join(''):'<div class="empty" style="padding:22px">Aucune info pour l’équipe.</div>');
    case 'pointage':return U.empId?myPointCard(U.empId):'';
    case 'semaine':return U.empId?staffWeekBlock(t):'';
    case 'checklist':return U.empId?checklistBlock(t):'';
  }
  return '';
}

function viewHub(){

  const name=esc((NET.config&&NET.config.adminName)||'');

   kpis:()=>`<div class="kpis">

    <div class="kpi"><div class="l">Personnes au travail</div><div class="v">${tot.pres}</div><div class="s">tous restaurants confondus</div></div></div>`,
   topflop:()=>{const all=[];list.forEach(R=>{if(!R._loaded.carte)return;withCtx(R,()=>salesAgg(UI.tf.p).forEach(o=>all.push({...o,resto:R.nom})));});const tf=topFlop(all,UI.tf.m);const tt=sum(all,o=>o.q);
     return `<section class="panel"><div class="panel-h"><h2>Top 10 / Flop 10 du réseau</h2>${tfControls()}</div><div class="panel-b">${tt?'':`<p class="faint" style="font-size:12.5px;margin-bottom:8px">Pas encore de vente sur la période : les flops sont les produits jamais vendus.</p>`}<div class="tf-grid"><div><div class="eyebrow tf-h ok">${ic('up','s')} Top ${tf.top.length}</div>${tfList(tf.top,UI.tf.m,false,true)}</div><div><div class="eyebrow tf-h bad">${ic('down','s')} Flop ${tf.flop.length}</div>${tfList(tf.flop,UI.tf.m,true,true)}</div></div></div></section>`;},
   restos:()=>`<div class="hub-grid">${st.map(({R,k,al})=>`<article class="rcard"><div class="rh"><div><div class="eyebrow">${esc(R.type||'Restaurant')}${R.ville?' · '+esc(R.ville):''}</div><h3>${esc(R.nom||'…')}</h3></div>${R.caisse&&R.caisse.status==='connected'?'<span class="pill ok"><span class="dot"></span>Caisse</span>':`<span class="pill">${R.caisse&&R.caisse.provider?esc(R.caisse.provider)+' à brancher':'Caisse à brancher'}</span>`}</div>
    ${k?`<div class="rs"><div><small>CA du jour</small><b>${eur(k.caHT,0)}</b></div><div><small>Tickets</small><b>${k.tickets}</b></div><div><small>Coût matière</small><b style="color:${k.caHT?`var(--${k.fcTone})`:'inherit'}">${k.caHT?pc(k.fc):'—'}</b></div><div><small>Masse salariale</small><b>${k.caHT?pc(k.msr):eur(k.ms,0)}</b></div></div>
    <div class="row wrap" style="gap:6px">${k.late?`<span class="pill bad"><span class="dot"></span>${k.late} retard${k.late>1?'s':''}</span>`:''}${k.off.length?`<span class="pill bad">${k.off.length} épuisé${k.off.length>1?'s':''}</span>`:''}${al?`<span class="pill brass">${ic('spark','s')} ${al} alerte${al>1?'s':''}</span>`:''}<span class="pill">${k.present}/${k.planned} au travail</span>${(R.emp||[]).length?'':'<span class="pill warn">Équipe à créer</span>'}</div>`:'<p class="faint">Chargement…</p>'}
    <button class="btn primary block" data-act="resto-enter" data-id="${R.id}">Entrer ${ic('chevR','s')}</button>

    <div class="rq"><span class="faint">Voir comme</span>${['patron','manager','staff'].map(x=>`<button class="btn xs" data-act="view-as-r" data-id="${R.id}" data-r="${x}">${ROLES[x]}</button>`).join('')}</div></article>`).join('')}
    <button class="rcard add" data-act="resto-new">${ic('plus','l')}<b>Ajouter un restaurant</b><small class="muted">Un nouveau client, un deuxième site…<br>Prêt en 1 minute depuis un modèle.</small></button></div>`,
   compte:()=>`<section class="panel"><div class="panel-h"><h2>Mon compte créateur</h2></div><div class="panel-b"><p class="muted" style="font-size:13.5px;max-width:72ch">Ton identifiant ouvre tous les restaurants. Chaque restaurant a ses propres identifiants (dans Réglages) : c’est ce que tu donnes au directeur pour connecter la tablette et le téléphone du resto.</p><div class="row wrap" style="gap:8px;margin-top:12px"><button class="btn" data-act="admin-edit">${ic('lock','s')} Identifiant, mot de passe, code</button>${DEVICE&&DEVICE.admin?`<button class="btn" data-act="device-out">Déconnecter cet appareil</button>`:''}</div></div></section>`,

}

/* ---------- V7 · mobile : tableaux en cartes (data-label/data-first auto) ---------- */
function mcardify(){
  $$('.tbl-wrap table.tbl').forEach(tbl=>{
    if(tbl.__mcards)return;tbl.__mcards=true;tbl.classList.add('mcards');
    const heads=$$('thead th',tbl).map(th=>th.textContent.trim());
    $$('tbody tr,tfoot tr',tbl).forEach(tr=>{
      if(tr.classList.contains('grp'))return;
      $$('td',tr).forEach((td,i)=>{
        if(i===0)td.setAttribute('data-first','1');
        else if(heads[i])td.setAttribute('data-label',heads[i]);
      });
    });
  });
}
(function(){
  let raf=null;
  const mo=new MutationObserver(()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=null;mcardify();});});
  mo.observe(document.body,{childList:true,subtree:true});
})();
