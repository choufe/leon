<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Léon Réseau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --surface-2:#E8EDE6; --sunk:#F6F8F4; --hover:#EEF2EC;
  --ink:#13201A; --ink-2:#48574F; --ink-3:#6E7C75; --line:#D7DED5; --line-2:#C3CCC1;
  --side:#18352B; --side-2:#23483A; --side-ink:#E6EEE9; --side-mute:#9DB4A8; --side-line:rgba(230,238,233,.12);
  --primary:#18352B; --on-primary:#FFFFFF;
  --brass:#93630F; --brass-ink:#FFFFFF; --brass-soft:#F5EAD3; --brass-line:#DDBF86;
  --ok:#23734A; --ok-soft:#DFF0E5; --warn:#8F5A05; --warn-soft:#FAEED4; --bad:#AE3526; --bad-soft:#F8E0DB; --info:#2A63A0; --info-soft:#E1EBF6;
  --p-salle:#2F6FB3; --p-cuisine:#C2562F; --p-bar:#7B4FB8; --p-plonge:#0A8C7B; --p-manager:#B07A12;
  --pop-bg:#18352B; --pop-ink:#EEF4F0; --pop-mute:#B3C8BC; --pop-code:#23483A; --pop-accent:#E9C47A;
  --ticket:#FFFEF8; --ticket-ink:#1E2621; --ticket-line:#CFCBBE;
  --shadow:0 1px 2px rgba(19,32,26,.05),0 14px 34px -14px rgba(19,32,26,.30);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0C1310; --surface:#131C18; --surface-2:#1B2621; --sunk:#101814; --hover:#1A241F;
    --ink:#E3EAE5; --ink-2:#A6B3AC; --ink-3:#81908A; --line:#243129; --line-2:#324139;
    --side:#08100D; --side-2:#17291F; --side-ink:#E3EAE5; --side-mute:#8BA497; --side-line:rgba(227,234,229,.09);
    --primary:#CFE2D6; --on-primary:#0C1310;
    --brass:#D6A34A; --brass-ink:#1A1204; --brass-soft:#33280F; --brass-line:#6B5424;
    --ok:#62C08A; --ok-soft:#14301F; --warn:#E3A845; --warn-soft:#352812; --bad:#F07F6D; --bad-soft:#3A1B16; --info:#77A6E0; --info-soft:#15243A;
    --p-salle:#5B8FD0; --p-cuisine:#D06A3C; --p-bar:#9876D0; --p-plonge:#239C8E; --p-manager:#BF8A26;
    --pop-bg:#E3EAE5; --pop-ink:#0F1814; --pop-mute:#4B5A52; --pop-code:#CBD6CF; --pop-accent:#7A520B;
    --ticket:#18221D; --ticket-ink:#DDE5DF; --ticket-line:#34423A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 38px -12px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1310; --surface:#131C18; --surface-2:#1B2621; --sunk:#101814; --hover:#1A241F;
  --ink:#E3EAE5; --ink-2:#A6B3AC; --ink-3:#81908A; --line:#243129; --line-2:#324139;
  --side:#08100D; --side-2:#17291F; --side-ink:#E3EAE5; --side-mute:#8BA497; --side-line:rgba(227,234,229,.09);
  --primary:#CFE2D6; --on-primary:#0C1310;
  --brass:#D6A34A; --brass-ink:#1A1204; --brass-soft:#33280F; --brass-line:#6B5424;
  --ok:#62C08A; --ok-soft:#14301F; --warn:#E3A845; --warn-soft:#352812; --bad:#F07F6D; --bad-soft:#3A1B16; --info:#77A6E0; --info-soft:#15243A;
  --p-salle:#5B8FD0; --p-cuisine:#D06A3C; --p-bar:#9876D0; --p-plonge:#239C8E; --p-manager:#BF8A26;
  --pop-bg:#E3EAE5; --pop-ink:#0F1814; --pop-mute:#4B5A52; --pop-code:#CBD6CF; --pop-accent:#7A520B;
  --ticket:#18221D; --ticket-ink:#DDE5DF; --ticket-line:#34423A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 38px -12px rgba(0,0,0,.65);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.012em;text-wrap:balance;font-weight:700}
p{margin:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.ic.s{width:15px;height:15px} svg.ic.l{width:22px;height:22px}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line-2);background:var(--surface);padding:.52rem .9rem;border-radius:9px;font-weight:600;font-size:13.5px;line-height:1.2;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.primary:hover{filter:brightness(1.12)}
.btn.brass{background:var(--brass);color:var(--brass-ink);border-color:transparent}
.btn.brass:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:.34rem .62rem;font-size:12.5px;border-radius:8px}
.btn.xs{padding:.22rem .5rem;font-size:12px;border-radius:7px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--ink-2)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.inp{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:.55rem .7rem;font-size:14px;min-width:0}
.inp:focus{outline:2px solid var(--brass);outline-offset:0;border-color:transparent}
textarea.inp{resize:vertical;min-height:40px;line-height:1.4}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:.36rem .7rem;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:.3rem .7rem;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent}
.chip .sw{width:9px;height:9px;border-radius:3px;background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:.38em;font-size:12px;font-weight:600;padding:.2rem .56rem;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.3}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.brass{background:var(--brass-soft);color:var(--brass)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.i-btn{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font:italic 700 11px/1 Georgia,"Times New Roman",serif;flex:none;vertical-align:middle;transition:all .15s}
.i-btn:hover,.i-btn[aria-expanded="true"]{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}

/* ---------- landing & lock ---------- */
.stage{min-height:100vh;min-height:100dvh;background-color:var(--side);color:var(--side-ink);background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.05) 0 1.5px,transparent 2.5px),radial-gradient(circle at 0 0,rgba(255,255,255,.035) 0 1px,transparent 2px);background-size:26px 26px,26px 26px;background-position:0 0,13px 13px;display:grid;place-items:center;padding-block:40px;padding-inline:16px}
.wordmark{font-family:var(--f-display);font-weight:800;letter-spacing:-.04em;line-height:.9}
.wordmark em{font-style:normal;color:var(--pop-accent)}
.landing{width:min(1040px,100%);display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.landing .wordmark{font-size:clamp(76px,12vw,148px)}
.landing .tag{font-family:var(--f-display);font-size:clamp(20px,2.4vw,26px);font-weight:600;margin-top:14px;color:var(--side-ink);max-width:24ch}
.landing .lede{color:var(--side-mute);margin-top:14px;font-size:15.5px;max-width:52ch}
.feat{margin-top:26px;display:grid;gap:10px}
.feat div{display:flex;gap:12px;align-items:flex-start;color:var(--side-ink);font-size:14.5px}
.feat svg{color:var(--pop-accent);margin-top:1px}
.resto-card{background:rgba(255,255,255,.04);border:1px solid var(--side-line);border-radius:18px;padding:26px}
:root[data-theme="dark"] .resto-card{background:rgba(255,255,255,.03)}
.resto-card .eyebrow{color:var(--side-mute)}
.resto-card h2{font-size:30px;margin-top:6px}
.resto-card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:18px 0 22px;font-size:14px}
.resto-card dt{color:var(--side-mute)} .resto-card dd{margin:0;font-weight:600}
.btn.launch{background:var(--pop-accent);color:#1A1204;border:0;padding:.95rem 1.2rem;font-size:15.5px;border-radius:12px;width:100%}
:root[data-theme="dark"] .btn.launch{background:#E9C47A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.launch{background:#E9C47A}}
.lock{width:min(400px,100%);display:flex;flex-direction:column;align-items:center;text-align:center}
.lock .wordmark{font-size:54px}
.lock .who{color:var(--side-mute);margin-top:6px;font-size:14px}
.lock h1{font-size:22px;margin-top:26px;font-weight:650}
.lock .sub{color:var(--side-mute);margin-top:6px;font-size:14px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:22px 0 8px}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;opacity:.55;transition:all .12s}
.pin-dots span.on{background:currentColor;opacity:1}
.pin-err{min-height:20px;font-size:13px;font-weight:600;color:var(--bad)}
.stage .pin-err{color:#FFB4A6}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center;margin-top:8px}
.key{height:72px;border-radius:50%;font-family:var(--f-mono);font-size:24px;font-weight:500;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:transform .08s,background .15s}
.key:active{transform:scale(.94)}
.key:hover{background:var(--hover)}
.key.small{font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--ink-2)}
.stage .key{background:rgba(255,255,255,.05);border-color:var(--side-line);color:var(--side-ink)}
.stage .key:hover{background:rgba(255,255,255,.1)}
.stage .key.small{color:var(--side-mute)}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.demo-codes{margin-top:26px;width:100%;border:1px dashed var(--side-line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:left}
.demo-codes .eyebrow{grid-column:1/-1;color:var(--side-mute)}
.demo-codes button{border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.04);text-align:left}
.demo-codes button:hover{background:rgba(255,255,255,.09)}
.demo-codes b{display:block;font-family:var(--f-mono);font-size:17px;letter-spacing:.12em;color:var(--pop-accent)}
.demo-codes small{color:var(--side-mute);font-size:12px}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:650;color:var(--ink-3)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:min(680px,100%);margin-top:24px}
.pick-grid button{background:rgba(255,255,255,.05);border:1px solid var(--side-line);border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--side-ink)}
.pick-grid button:hover{background:rgba(255,255,255,.1)}
.pick-grid small{color:var(--side-mute);font-size:12px}

/* ---------- avatar ---------- */
.av{--c:var(--p-salle);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:color-mix(in oklab,var(--c) 82%,#000);flex:none;letter-spacing:.02em}
.av.l{width:46px;height:46px;font-size:15px}
.av.s{width:24px;height:24px;font-size:10px}
.av[data-poste="salle"]{--c:var(--p-salle)} .av[data-poste="cuisine"]{--c:var(--p-cuisine)} .av[data-poste="bar"]{--c:var(--p-bar)} .av[data-poste="plonge"]{--c:var(--p-plonge)} .av[data-poste="manager"]{--c:var(--p-manager)} .av[data-poste="patron"]{--c:#4F5D56}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:20px 12px 16px;z-index:20}
.side .brand{padding:0 10px}
.side .brand .wordmark{font-size:34px}
.side .brand small{display:block;color:var(--side-mute);font-size:12.5px;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--side-mute);font-weight:600;font-size:14px;text-align:left}
.nav button:hover{color:var(--side-ink);background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{color:var(--side-ink);background:var(--side-2)}
.nav button[aria-current="page"] svg{color:var(--pop-accent)}
.side-foot{margin-top:auto;border-top:1px solid var(--side-line);padding:14px 6px 0;display:flex;align-items:center;gap:10px}
.side-foot .who{min-width:0;flex:1}
.side-foot .who b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who small{color:var(--side-mute);font-size:12px}
.side-foot .icon-btn{color:var(--side-mute)}
.side-foot .icon-btn:hover{background:rgba(255,255,255,.07);color:var(--side-ink)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:15}
.top .t-l{min-width:0;flex:1}
.top .t-date{font-weight:650;font-size:14px}
.top .t-svc{font-size:12.5px;color:var(--ink-2)}
.clock{font-family:var(--f-mono);font-weight:600;font-size:15px;padding:.3rem .6rem;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.role-pill{font-size:12px}
.top .ask{gap:.5em}
.top .lock-m{display:none}
.view{padding:26px 28px 130px;width:100%;max-width:1360px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;margin-bottom:20px}
.ph h1{font-size:30px;font-weight:750;line-height:1.1}
.ph .sub{color:var(--ink-2);margin-top:5px;font-size:14px;max-width:70ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-weight:600;font-size:13px;margin-bottom:8px}
.back:hover{color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{padding:10px 12px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 12px;flex-wrap:wrap}
.panel-h h2,.panel-h h3{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.panel-b{padding:0 16px 16px}
.panel-b.flush{padding:0}
.sec-t{font-size:17px;font-weight:700;margin:0 0 10px;display:flex;gap:8px;align-items:center}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 15px;display:flex;flex-direction:column;gap:5px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--f-display);font-size:29px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.kpi .v small{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:3px}
.kpi .s{font-size:12.5px;color:var(--ink-2)}
.meter{position:relative;height:6px;border-radius:99px;background:var(--surface-2);margin-top:6px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ok)}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}
.meter b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px}

/* alerts list */
.alerts{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px;border-top:1px solid var(--line)}
.al:first-child{border-top:0}
.al .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.al .ico.bad{background:var(--bad-soft);color:var(--bad)} .al .ico.warn{background:var(--warn-soft);color:var(--warn)} .al .ico.info{background:var(--info-soft);color:var(--info)} .al .ico.ok{background:var(--ok-soft);color:var(--ok)} .al .ico.brass{background:var(--brass-soft);color:var(--brass)}
.al b{display:block;font-size:14px}
.al p{font-size:13px;color:var(--ink-2);margin-top:2px}
.al .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* people list */
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow b{font-size:13.5px;display:block}
.prow small{color:var(--ink-3);font-size:12px}

/* tables */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:650;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right} .tbl .c{text-align:center}
.tbl td.r,.tbl td.num{font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl tfoot td{font-weight:700;background:var(--sunk);border-top:1px solid var(--line-2)}
.tbl .th-i{display:inline-flex;align-items:center;gap:5px}
.cell-name b{display:block;font-size:14px}
.cell-name small{color:var(--ink-3);font-size:12px}
.tinp{width:88px;border:1px solid var(--line-2);border-radius:7px;padding:.3rem .45rem;text-align:right;background:var(--surface);font-variant-numeric:tabular-nums}
.tinp:focus{outline:2px solid var(--brass);border-color:transparent}

/* ---------- planning ---------- */
.plan-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.wk-nav{display:inline-flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.wk-nav .lbl2{padding:0 10px;font-weight:650;font-size:13.5px;min-width:190px;text-align:center;color:var(--ink)}
.pg-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);-webkit-overflow-scrolling:touch}
.pg{border-collapse:separate;border-spacing:0;width:100%;min-width:1060px;table-layout:fixed}
.pg th,.pg td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top}
.pg th:last-child,.pg td:last-child{border-right:0}
.pg thead th{background:var(--sunk);padding:9px 8px;text-align:left;font-weight:600}
.pg .ec{width:212px;position:sticky;left:0;z-index:3;background:var(--surface)}
.pg thead .ec{background:var(--sunk)}
.pg .dh{display:flex;flex-direction:column;gap:2px}
.pg .dh b{font-size:13px}
.pg .dh small{font-size:11.5px;color:var(--ink-3);font-weight:500}
.pg th.today{background:var(--brass-soft)}
.pg th.today b{color:var(--brass)}
.pg td.cell{padding:5px;height:62px;background:var(--surface);transition:background .12s}
.pg td.cell.today{background:color-mix(in oklab,var(--brass-soft) 45%,var(--surface))}
.pg td.closed,.pg th.closed{background-image:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px)}
.pg td.drop-hi{background:var(--info-soft);outline:2px dashed var(--info);outline-offset:-3px}
.pg tr.me td{background:color-mix(in oklab,var(--brass-soft) 55%,var(--surface))}
.pg tr.me .ec{box-shadow:inset 3px 0 0 var(--brass)}
.erow{display:flex;align-items:center;gap:9px;padding:8px 10px}
.erow .nm{min-width:0;flex:1}
.erow b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow small{font-size:11.5px;color:var(--ink-3);display:block}
.hrs{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.hrs .bar{flex:1;height:4px;border-radius:9px;background:var(--surface-2);position:relative;overflow:hidden;max-width:64px}
.hrs .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:9px}
.hrs .bar i.warn{background:var(--warn)} .hrs .bar i.bad{background:var(--bad)} .hrs .bar i.info{background:var(--info)}
.shift{--pc:var(--p-salle);display:block;width:100%;text-align:left;border-radius:7px;padding:5px 7px 5px;color:#fff;background:color-mix(in oklab,var(--pc) 84%,#000);font-size:11.5px;line-height:1.25;margin-bottom:4px;cursor:default;position:relative}
button.shift[data-act="shift-edit"]{cursor:grab}
.shift:hover{filter:brightness(1.1)}
.shift.dragging{opacity:.4}
.shift .t{display:block;font-weight:600;font-family:var(--f-mono);font-size:11.5px;letter-spacing:-.01em}
.shift .m{opacity:.85;font-size:11px}
.shift .pt{position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;background:#7CF0AE;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.shift .pt.late{background:#FFB4A6}
[data-poste="salle"]{--pc:var(--p-salle)} [data-poste="cuisine"]{--pc:var(--p-cuisine)} [data-poste="bar"]{--pc:var(--p-bar)} [data-poste="plonge"]{--pc:var(--p-plonge)} [data-poste="manager"]{--pc:var(--p-manager)}
.absb{display:block;width:100%;text-align:left;border-radius:7px;padding:6px 7px;font-size:11.5px;font-weight:650;color:var(--ink-2);border:1px dashed var(--line-2);background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,transparent 5px 10px);margin-bottom:4px}
.absb small{display:block;font-weight:500;color:var(--ink-3)}
.add-slot{display:flex;align-items:center;justify-content:center;width:100%;min-height:24px;border-radius:7px;color:var(--ink-3);opacity:0;transition:opacity .12s;border:1px dashed var(--line-2)}
.cell:hover .add-slot,.add-slot:focus-visible{opacity:1}
.cell:not(:has(.shift)):not(:has(.absb)) .add-slot{min-height:50px}
.grp td{background:var(--sunk);padding:6px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-2)}
.grp td .sw{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--pc);margin-right:7px;vertical-align:1px}
.pg tfoot td{background:var(--sunk);padding:7px 8px;font-size:12px;vertical-align:middle}
.pg tfoot .ec{background:var(--sunk);font-weight:650;color:var(--ink-2)}
.pg tfoot .ec .row{padding:0 2px}
.cov{display:flex;flex-direction:column;gap:3px}
.cov span{display:flex;align-items:center;gap:4px;font-weight:600;white-space:nowrap}
.cov .ok{color:var(--ok)} .cov .warn{color:var(--warn)}
.ft-v{font-weight:650;font-variant-numeric:tabular-nums}
.ft-s{font-size:11px;color:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:color-mix(in oklab,var(--pc) 84%,#000)}
.plan-alerts{margin-bottom:14px}
.plan-alerts .al{padding:10px 14px}
.hint{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.empty{padding:36px 20px;text-align:center;color:var(--ink-2)}
.empty h3{font-size:18px;color:var(--ink);margin-bottom:6px}
.empty .acts{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}

/* day view */
.dayv{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow-x:auto}
.dayv-in{min-width:880px;padding:12px 14px 14px}
.tl-row{display:grid;grid-template-columns:170px minmax(0,1fr);align-items:center;min-height:40px}
.tl-row .who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;min-width:0}
.tl-row .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:40px;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100%/17) 100%;border-bottom:1px solid var(--line)}
.track .rush{position:absolute;top:0;bottom:0;background:color-mix(in oklab,var(--brass-soft) 70%,transparent)}
.track .bar{position:absolute;top:7px;height:18px;border-radius:5px;background:color-mix(in oklab,var(--pc) 84%,#000);color:#fff;font:600 10.5px/18px var(--f-mono);padding:0 6px;white-space:nowrap;overflow:hidden}
.track .real{position:absolute;top:29px;height:4px;border-radius:3px;background:var(--ink)}
.track .nowl{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--brass);z-index:2}
.tl-head .track{background:none;border:0;height:24px}
.tl-head .track span{position:absolute;top:4px;transform:translateX(-50%);font:500 11px var(--f-mono);color:var(--ink-3)}
.tl-head .track span.rl{transform:none;color:var(--brass);font-weight:600;font-family:var(--f-ui)}
.cov-chart .track{height:70px;background-size:calc(100%/17) 100%;border-bottom:1px solid var(--line-2)}
.cov-chart .cb{position:absolute;bottom:0;background:var(--info);border-radius:3px 3px 0 0;opacity:.85}
.cov-chart .cb:hover{opacity:1}
.cov-chart .cl{position:absolute;font:600 10.5px var(--f-mono);color:var(--ink-2);transform:translateX(-50%)}
.tl-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ink-2)}
.tl-legend span{display:inline-flex;gap:6px;align-items:center}
.tl-legend i{display:inline-block;width:16px;height:4px;border-radius:2px;background:var(--ink)}
.tl-legend i.rush{height:10px;width:12px;background:var(--brass-soft);border:1px solid var(--brass-line)}
.tl-legend i.nowi{width:2px;height:12px;background:var(--brass)}

/* ---------- pointage ---------- */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.pcard h2{font-size:22px}
.pcard .shifts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pcard .shifts .shift{width:auto;margin:0;padding:7px 10px}
.pcard .shifts .shift .t{font-size:13px}
.pcard .st{margin-top:12px;font-size:14px;color:var(--ink-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcard .pacts{display:flex;flex-direction:column;gap:8px;min-width:230px}
.btn.big{padding:1rem 1.2rem;font-size:15.5px;border-radius:12px}
.evs{display:flex;gap:6px;flex-wrap:wrap}
.ev{display:inline-flex;align-items:center;gap:4px;font:500 12px var(--f-mono);padding:.16rem .45rem;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.ev.in{background:var(--ok-soft);color:var(--ok)} .ev.out{background:var(--surface-2);color:var(--ink-2)} .ev.pause,.ev.back{background:var(--info-soft);color:var(--info)}
.ev.corr::after{content:"corr.";font-family:var(--f-ui);font-size:10px;margin-left:3px;opacity:.8}
.kiosk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kiosk button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.kiosk button:hover{border-color:var(--ink-3)}
.kiosk b{font-size:15px}
.kiosk-frame{background:var(--sunk);border:1px solid var(--line);border-radius:20px;padding:20px}
.kiosk-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.kiosk-top .big-clock{font:600 34px var(--f-mono);letter-spacing:-.02em}
.confirm{text-align:center;padding:6px 0}
.confirm .big-check{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:var(--ok-soft);color:var(--ok)}
.confirm .big-check.warn{background:var(--warn-soft);color:var(--warn)}
.confirm .tm{font:600 40px var(--f-mono);letter-spacing:-.02em;margin:4px 0}
.releve td .pr{display:block;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.releve td .re{display:block;font-weight:650;font-variant-numeric:tabular-nums}
.releve td.cl{background-image:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,transparent 5px 10px)}

/* ---------- staff home ---------- */
.week-mini{display:flex;flex-direction:column}
.wm{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 16px;border-top:1px solid var(--line);font-size:13px}
.wm:first-child{border-top:0}
.wm.today{background:var(--brass-soft)}
.wm .d{font-weight:650}
.wm .s{display:flex;gap:6px;flex-wrap:wrap}
.wm .s .shift{width:auto;margin:0;padding:3px 7px}
.note{padding:12px 16px;border-top:1px solid var(--line);font-size:13.5px}
.note:first-child{border-top:0}
.note small{display:block;color:var(--ink-3);font-size:12px;margin-bottom:2px;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 16px;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
.check:first-child{border-top:0}
.check input{width:18px;height:18px;accent-color:var(--ok);margin-top:1px;flex:none}
.check.done span{color:var(--ink-3);text-decoration:line-through}

/* ---------- recettes ---------- */
.rec-filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search .inp{padding-left:34px}
.rtype{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--surface-2);color:var(--ink-2);flex:none}
.name-cell{display:flex;align-items:center;gap:10px}
.new-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);margin-left:6px}
.al-chips{display:flex;gap:4px;flex-wrap:wrap}
.al-chip{font-size:11px;font-weight:650;padding:.12rem .45rem;border-radius:5px;background:var(--warn-soft);color:var(--warn)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.metric{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);min-width:0}
.metric .l{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px;justify-content:space-between}
.metric .v{font-family:var(--f-display);font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.metric .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.metric.ok .v{color:var(--ok)} .metric.warn .v{color:var(--warn)} .metric.bad .v{color:var(--bad)}
.split{display:flex;height:14px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 10px}
.split i{display:block;height:100%}
.split-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.split-leg span{display:inline-flex;align-items:center;gap:6px}
.split-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.steps{margin:0;padding:0;list-style:none;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(st);font:600 12px/24px var(--f-mono);width:24px;height:24px;border-radius:50%;text-align:center;background:var(--surface-2);color:var(--ink-2)}
.sim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.sim input[type=range]{width:100%;accent-color:var(--brass)}
.sim-out{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13.5px}
.sim-out b{font-variant-numeric:tabular-nums}
.me-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.me-q{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);min-height:120px}
.me-q h4{font-size:15px;display:flex;align-items:center;gap:8px}
.me-q p{font-size:12.5px;color:var(--ink-2);margin:3px 0 8px}
.me-q ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.me-q li{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 8px;border-radius:7px;background:var(--sunk)}
.me-q li span:last-child{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.me-axis{font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:650;display:flex;justify-content:space-between;margin-bottom:6px}

/* ---------- assembleur ---------- */
.stepper{display:flex;gap:6px;margin:0 0 20px;padding:0;list-style:none;overflow-x:auto}
.stepper li{flex:1;min-width:130px}
.stepper button{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:left;font-weight:600;font-size:13px;color:var(--ink-2)}
.stepper .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--f-mono);background:var(--surface-2);flex:none}
.stepper button[aria-current="step"]{border-color:var(--brass);color:var(--ink);background:var(--brass-soft)}
.stepper button[aria-current="step"] .n{background:var(--brass);color:var(--brass-ink)}
.stepper button.done .n{background:var(--ok);color:#fff}
.asm{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.asm-side{position:sticky;top:76px}
.asm-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.asm-card+.asm-card{margin-top:14px}
.asm-card h2{font-size:20px}
.asm-card .intro{color:var(--ink-2);margin-top:4px;font-size:14px;max-width:62ch}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:16px}
.types button{border:1px solid var(--line-2);border-radius:12px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.types button:hover{border-color:var(--ink-3)}
.types button[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-soft);box-shadow:inset 0 0 0 1px var(--brass)}
.types b{font-size:14.5px}
.types small{font-size:12px;color:var(--ink-2);line-height:1.35}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.form-grid .full{grid-column:1/-1}
.stepper-num{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface)}
.stepper-num button{width:38px;height:38px;font-size:18px;color:var(--ink-2)}
.stepper-num button:hover{background:var(--hover)}
.stepper-num input{width:64px;border:0;text-align:center;font-size:15px;font-weight:650;background:transparent;height:38px}
.stepper-num input:focus{outline:none}
.lib-tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px;align-items:center}
.lib{border:1px solid var(--line);border-radius:12px;max-height:380px;overflow:auto}
.lib-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);width:100%;text-align:left}
.lib-row:first-child{border-top:0}
.lib-row:hover{background:var(--hover)}
.lib-row b{font-size:13.5px;display:block}
.lib-row small{font-size:12px;color:var(--ink-3)}
.lib-row .pr{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2);white-space:nowrap}
.lib-row .plus{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.lib-row.in .plus{background:var(--ok-soft);color:var(--ok)}
.composer{border:2px solid var(--brass);background:var(--brass-soft);border-radius:14px;padding:16px;margin-bottom:14px}
.composer h3{font-size:17px}
.composer .cgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin-top:12px;align-items:end}
.composer .qrow{display:flex;gap:8px;align-items:center}
.composer .qrow .inp{max-width:120px;font-size:16px;font-weight:650}
.composer .res{margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.composer .res b{font-variant-numeric:tabular-nums}
.comp-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.comp{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 10px;border-top:1px solid var(--line);background:var(--surface)}
.comp:first-child{border-top:0}
.comp .n{font:600 12px var(--f-mono);color:var(--ink-3);text-align:center}
.comp b{font-size:13.5px;display:block}
.comp small{font-size:12px;color:var(--ink-3)}
.comp .c{font-variant-numeric:tabular-nums;font-weight:650;font-size:13.5px}
.comp .ctl{display:flex;gap:2px}
.newing{border:1px dashed var(--line-2);border-radius:12px;padding:14px;margin-top:12px;background:var(--sunk)}
.alg-pick{display:flex;flex-wrap:wrap;gap:6px}
.alg-pick label{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;border:1px solid var(--line-2);border-radius:999px;padding:.22rem .6rem;cursor:pointer;background:var(--surface)}
.alg-pick input{accent-color:var(--brass)}
.alg-pick label.auto{background:var(--warn-soft);color:var(--warn);border-color:transparent;cursor:default}
.gauge{position:relative;height:16px;border-radius:6px;overflow:hidden;display:flex;margin:10px 0 26px}
.gauge .z1{background:var(--ok-soft)} .gauge .z2{background:var(--warn-soft)} .gauge .z3{background:var(--bad-soft)}
.gauge-wrap{position:relative}
.gauge-wrap .mk{position:absolute;top:4px;width:3px;height:24px;border-radius:2px;background:var(--ink);transform:translateX(-50%)}
.gauge-wrap .mk span{position:absolute;top:26px;left:50%;transform:translateX(-50%);font:700 12px var(--f-mono);white-space:nowrap}
.gauge-wrap .tg{position:absolute;top:10px;height:16px;border-left:2px dashed var(--ink-2)}
.gauge-wrap .tg span{position:absolute;top:-17px;left:4px;font-size:11px;color:var(--ink-2);white-space:nowrap;font-weight:600}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sugg button{border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;text-align:left;background:var(--surface)}
.sugg button:hover{border-color:var(--brass)}
.sugg b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.sugg small{font-size:11.5px;color:var(--ink-3)}
.step-edit{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:start;margin-top:8px}
.step-edit .n{font:600 12px/36px var(--f-mono);color:var(--ink-3);text-align:center}
.checks{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.checks div{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.checks .ok{color:var(--ok)} .checks .warn{color:var(--warn)} .checks .bad{color:var(--bad)}
.asm-nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.ticket{background:var(--ticket);color:var(--ticket-ink);font-family:var(--f-mono);font-size:12.5px;padding:18px 18px 22px;border-radius:6px 6px 0 0;box-shadow:var(--shadow);position:relative;margin-bottom:10px}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:radial-gradient(circle at 6px 0,var(--ticket) 5.5px,transparent 6px) 0 0/12px 8px repeat-x}
.tk-h{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;font-weight:600;opacity:.7}
.tk-name{font-family:var(--f-display);font-size:21px;font-weight:700;margin-top:12px;line-height:1.15;letter-spacing:-.01em}
.tk-sub{font-size:11.5px;opacity:.75;margin-top:3px}
.tk-sep{border-top:1.5px dashed var(--ticket-line);margin:12px 0}
.tk-l{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:8px;padding:2px 0;align-items:baseline}
.tk-l .q{opacity:.75;text-align:right}
.tk-l .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-l.hi{animation:tkhi 1.2s}
@keyframes tkhi{0%{background:var(--brass-soft)}100%{background:transparent}}
.tk-t{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.tk-t.big{font-size:15px;font-weight:600;padding-top:5px}
.tk-t .ok{color:var(--ok)} .tk-t .warn{color:var(--warn)} .tk-t .bad{color:var(--bad)}
.tk-empty{opacity:.6;padding:6px 0;font-size:12px}
.tk-foot{font-size:11px;opacity:.7;margin-top:10px;line-height:1.4}

/* ---------- stock ---------- */
.dlc{font:600 11.5px var(--f-mono)}
.sup-block+.sup-block{margin-top:14px}

/* ---------- équipe ---------- */
.codes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.codecard{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface)}
.codecard .code{font:600 30px var(--f-mono);letter-spacing:.18em;margin:6px 0 4px}
.codecard p{font-size:13px;color:var(--ink-2)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:700} .no{color:var(--ink-3)} .ro{color:var(--info);font-weight:600;font-size:12.5px}

/* ---------- popover / modal / toast ---------- */
.pop{position:fixed;z-index:80;width:min(350px,calc(100vw - 24px));background:var(--pop-bg);color:var(--pop-ink);border-radius:14px;padding:15px 16px 14px;box-shadow:var(--shadow);font-size:13.5px;line-height:1.5}
.pop h4{font-size:16px;margin-bottom:5px;padding-right:22px}
.pop .f{font-family:var(--f-mono);font-size:12px;background:var(--pop-code);border-radius:8px;padding:8px 10px;margin:9px 0}
.pop .r{color:var(--pop-mute);font-size:12.5px}
.pop .ex{margin-top:9px;color:var(--pop-accent);font-weight:600;font-size:13px}
.pop .x{position:absolute;top:10px;right:10px;color:var(--pop-mute)}
.pop ul{margin:8px 0 0;padding-left:18px}
.pop li{margin:3px 0}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(8,14,11,.52);display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;width:min(540px,100%);max-height:calc(100% - 24px);overflow:auto;box-shadow:var(--shadow);padding:22px;animation:rise .18s}
.modal.wide{width:min(680px,100%)}
.modal.narrow{width:min(400px,100%)}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.modal h3{font-size:20px}
.modal .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.modal .mh p{color:var(--ink-2);font-size:13.5px;margin-top:3px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.modal .mf .sp{flex:1}
.modal .pin-pad{grid-template-columns:repeat(3,64px)}
.modal .key{height:64px}
.modal .pin-dots{color:var(--ink)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{font-size:12px;font-weight:600;padding:.3rem .55rem;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.presets button:hover{border-color:var(--ink-3)}
.presets i{width:8px;height:8px;border-radius:2px;background:color-mix(in oklab,var(--pc) 84%,#000)}
.days-pick{display:flex;gap:5px;flex-wrap:wrap}
.days-pick label{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;border:1px solid var(--line-2);border-radius:8px;padding:.3rem .5rem;cursor:pointer}
.days-pick label.dis{opacity:.4;cursor:not-allowed}
.days-pick input{accent-color:var(--brass)}
.sm-sum{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:13px;display:flex;flex-direction:column;gap:4px}
.sm-sum .warn{color:var(--warn);font-weight:600} .sm-sum .bad{color:var(--bad);font-weight:600}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px)}
.toast{background:var(--pop-bg);color:var(--pop-ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow);display:flex;gap:9px;align-items:center;animation:rise .2s;max-width:520px}
.toast svg{color:var(--pop-accent)}

/* ---------- demo bar ---------- */
.demo{position:fixed;left:248px;bottom:16px;z-index:40;display:flex;align-items:center;gap:4px;background:var(--pop-bg);color:var(--pop-ink);border-radius:14px;padding:5px 6px 5px 12px;box-shadow:var(--shadow);font-size:12.5px;max-width:calc(100vw - 32px);flex-wrap:wrap}
.demo .tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--pop-accent);margin-right:4px}
.demo .dclock{font:600 14px var(--f-mono);margin-right:6px}
.demo button{padding:.34rem .55rem;border-radius:8px;font-weight:600;color:var(--pop-ink);opacity:.85}
.demo button:hover{background:rgba(127,127,127,.2);opacity:1}

/* ---------- chat ---------- */
.chat{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);z-index:60;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .2s}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.chat-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.chat-h .lg{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--side);color:var(--pop-accent)}
.chat-h b{display:block;font-family:var(--f-display);font-size:17px}
.chat-h small{color:var(--ink-3);font-size:12px}
.chat-b{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;white-space:normal;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--sunk);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a.pending{color:var(--ink-3);font-style:italic}
.msg ul{margin:6px 0;padding-left:18px}
.msg p+p{margin-top:6px}
.msg .src{display:block;margin-top:6px;font-size:11px;color:var(--ink-3);font-style:normal}
.chat-sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.chat-sugg button{font-size:12.5px;border:1px solid var(--line-2);border-radius:999px;padding:.34rem .7rem;background:var(--surface);text-align:left}
.chat-sugg button:hover{border-color:var(--brass)}
.chat-f{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.chat-f .inp{flex:1}
.chat-intro{font-size:13.5px;color:var(--ink-2);background:var(--brass-soft);border-radius:12px;padding:12px 14px}
.chat-intro b{color:var(--ink)}


/* ---------- v2 : réseau, service, réglages ---------- */
a.btn{text-decoration:none;color:inherit}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.rcard .rh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rcard h3{font-size:21px;margin-top:2px}
.rcard .rs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rcard .rs div{background:var(--sunk);border-radius:10px;padding:9px 11px}
.rcard .rs small{display:block;font-size:12px;color:var(--ink-2);font-weight:600}
.rcard .rs b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}
.rcard.add{border:1.5px dashed var(--line-2);align-items:center;justify-content:center;text-align:center;color:var(--ink-2);min-height:230px;background:transparent}
.rcard.add:hover{border-color:var(--brass);color:var(--ink)}
.rcard.add b{font-size:16px;color:var(--ink)}
.hub-back{display:flex;align-items:center;gap:6px;color:var(--pop-accent);font-weight:600;font-size:13px;padding:6px 10px;border-radius:8px;text-align:left}
:root[data-theme="dark"] .hub-back{color:#E9C47A}
.hub-back:hover{background:rgba(255,255,255,.06)}
.nav-sep{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-mute);font-weight:700;padding:14px 10px 4px}
.side .nav{overflow-y:auto;min-height:0}
.banner{padding:8px 16px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600;text-align:center}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.onb{margin-bottom:18px}
.onb-row{display:flex;gap:10px;align-items:center}
.onb-row .ok{color:var(--ok)}
.onb-row small{font-size:12.5px}
.ardoise{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:18px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dcard b{font-size:14px;line-height:1.25}
.dcard.low{border-color:var(--warn);background:color-mix(in oklab,var(--warn-soft) 60%,var(--surface))}
.dcard.off{background:var(--sunk)}
.dcard.off b{text-decoration:line-through;color:var(--ink-3)}
.dcount{font:700 38px/1 var(--f-display);font-variant-numeric:tabular-nums;text-align:left;color:var(--ink);padding:2px 0;align-self:flex-start}
.dcount:hover{color:var(--brass)}
.dcount.inf{color:var(--ink-3);font-size:30px}
.dcard.off .dcount{color:var(--bad)}
.dlabel{font-size:12px;font-weight:600;color:var(--ink-3)}
.dlabel.warn{color:var(--warn)} .dlabel.bad{color:var(--bad)}
.dctl{display:flex;gap:5px}
.dctl .btn{flex:1;padding:.38rem .3rem}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.pos-btn{border:1px solid var(--line);border-radius:12px;padding:9px 10px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:2px;min-height:66px}
.pos-btn:hover{border-color:var(--brass)}
.pos-btn[disabled]{opacity:.45;cursor:not-allowed}
.pos-btn[disabled] b{text-decoration:line-through}
.pos-btn b{font-size:12.5px;line-height:1.25}
.pos-btn small{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12px}
.pos-btn .left{font-size:11px;font-weight:700;color:var(--warn)}
.tline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:3px 0}
.setup-card{width:min(640px,100%)}
.dark-form .field>label{color:var(--side-mute)}
.dark-form .inp{background:rgba(255,255,255,.06);border-color:var(--side-line);color:var(--side-ink)}
.dark-form select.inp option{color:#13201A;background:#fff}
.btn.demo-link{background:transparent;color:var(--side-ink);border-color:var(--side-line)}
.btn.demo-link:hover{background:rgba(255,255,255,.08)}
.side-foot a.icon-btn{color:var(--side-mute)}
.side-foot a.icon-btn:hover{background:rgba(255,255,255,.07);color:var(--side-ink)}


/* ---------- v3 ---------- */
.viewas{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brass-soft);color:var(--ink);border:1px solid var(--brass-line);border-radius:12px;padding:8px 12px;margin-bottom:16px;font-size:13.5px}
.viewas>span:first-child{display:inline-flex;gap:6px;align-items:center}
.lock-clock{font:600 44px/1 var(--f-mono);letter-spacing:-.02em;margin-top:10px;color:var(--side-ink)}
.lock-info{margin-top:22px;display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.lk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--side-mute);background:rgba(255,255,255,.04);border:1px solid var(--side-line);border-radius:10px;padding:8px 10px}
.lk.bad{color:#FFB4A6}.lk.warn{color:#F2CF8B}
.badge-acts{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:22px}
.badge-acts .btn.big{font-size:17px;padding:1.05rem 1.2rem;border-radius:14px}
.login-form{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:22px;text-align:left}
.login-form .btn.launch{margin-top:4px}
.keep{display:flex;gap:8px;align-items:center;color:var(--side-mute);font-size:13.5px}
.keep input{accent-color:var(--pop-accent);width:16px;height:16px}
.hint-dark{color:var(--side-mute);font-size:12.5px;text-align:center}
.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.home-grid .hb.full{grid-column:1/-1}
.home-grid .hb:empty{display:none}
.home-grid .onb{margin-bottom:0}
.tf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tf-h{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.tf-h.ok{color:var(--ok)}.tf-h.bad{color:var(--bad)}
.tf-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tf-list li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.tf-list li:first-child{border-top:0}
.tf-n{font:600 12px var(--f-mono);color:var(--ink-3)}
.tf-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tf-v{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.tf-v.bad{color:var(--bad)}
.pz-list{display:flex;flex-direction:column;gap:6px}
.pz-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.pz-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--brass);flex:none}
.pz-row .inp{padding:.4rem .6rem}
.off-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--pop-accent);opacity:.8}
.rc-tbl td{vertical-align:middle}
.rc-tbl tr.rc-done td{background:color-mix(in oklab,var(--ok-soft) 35%,var(--surface))}
.cred{display:grid;gap:10px;background:var(--sunk);border-radius:12px;padding:14px}
.cred>div{display:flex;justify-content:space-between;gap:10px;align-items:center}
.cred b{font-size:18px;letter-spacing:.04em}
.label-card{width:320px;margin:0 auto;border:2px dashed var(--line-2);border-radius:14px;padding:22px;background:var(--surface);text-align:center}
.label-card .lb-top{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
.label-card .lb-prod{font-size:21px;font-weight:800;margin:8px 0 2px;line-height:1.25}
.label-card .lb-sub{font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.label-card .lb-bc{height:26px;margin:12px 0;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px)}
.label-card .lb-dlc{font-size:15px;font-weight:700;color:var(--bad);line-height:1.4}
.label-card .lb-foot{font-size:10.5px;color:var(--ink-3);margin-top:12px}
#print-label{display:none}
@media print{
  body>*:not(#print-label){display:none!important}
  #print-label{display:block!important;position:fixed;inset:0;padding:40px;background:#fff}
  #print-label .label-card{border-color:#000}
  #print-label .lb-dlc{color:#000}
}

/* ---------- responsive ---------- */
@media (max-width: 1100px){
  .grid2{grid-template-columns:minmax(0,1fr)}
  .home-grid{grid-template-columns:minmax(0,1fr)}
  .asm{grid-template-columns:minmax(0,1fr)}
  .asm-side{position:static}
}
@media (max-width: 900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;gap:8px;padding:8px 12px;overflow:hidden}
  .side .brand .wordmark{font-size:24px}
  .side .brand small{display:none}
  .side .brand{padding:0 4px;flex:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1;gap:2px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{padding:8px 10px;font-size:13px;white-space:nowrap;gap:7px}
  .side-foot{display:none}
  .nav-sep{display:none}
  .hub-back{flex:none;padding:6px 8px}
  .top{padding:10px 16px;position:static}
  .top .lock-m{display:inline-grid}
  .view{padding:18px 16px 150px}
  .ph h1{font-size:25px}
  .demo{left:16px;bottom:12px}
  .landing{grid-template-columns:minmax(0,1fr);gap:28px}
  .grid2e{grid-template-columns:minmax(0,1fr)}
  .codes{grid-template-columns:minmax(0,1fr)}
  .pcard{grid-template-columns:minmax(0,1fr)}
  .pcard .pacts{min-width:0}

const shiftsWD=(w,d)=>S.shifts.filter(x=>x.w===w&&x.d===d);
const empShifts=(emp,w,d)=>S.shifts.filter(x=>x.emp===emp&&x.w===w&&x.d===d).sort((a,b)=>sMin(a)-sMin(b));
const absOf=(emp,w,d)=>S.absences.find(a=>a.emp===emp&&a.w===w&&a.d===d);
const empWeekMin=(emp,w)=>sum(S.shifts.filter(x=>x.emp===emp&&x.w===w),durMin);
const dayCost=(w,d)=>sum(shiftsWD(w,d),x=>durMin(x)/60*empById(x.emp).taux);
const dayHours=(w,d)=>sum(shiftsWD(w,d),durMin);
const dayCA=d=>{if(isClosed(d))return 0;const c=prevOf(d);return c[0]*((S.ticket&&S.ticket.midi)||0)+c[1]*((S.ticket&&S.ticket.soir)||0);};
function coverage(w,d){
  if(isClosed(d))return [];
  if(!EMP.some(e=>['salle','cuisine','bar'].includes(e.poste)))return [];
  const c=prevOf(d);const out=[];const sh=shiftsWD(w,d);
  ['midi','soir'].forEach((svc,i)=>{
    const cv=c[i];if(!cv)return;
    const [a,b]=SVC[svc];
    const on=sh.filter(x=>sMin(x)<b&&eMin(x)>a);
    const cnt=ps=>new Set(on.filter(x=>ps.includes(x.poste)).map(x=>x.emp)).size;
    const need={salle:Math.max(1,Math.ceil(cv/50)),cuisine:Math.max(1,Math.ceil(cv/55)),bar:cv>=80?1:0};
    const have={salle:cnt(['salle','manager']),cuisine:cnt(['cuisine']),bar:cnt(['bar'])};
    const miss=Object.keys(need).filter(k=>have[k]<need[k]);
    out.push({svc,cv,need,have,miss});
  });
  return out;
}
function planAlerts(w){
  const A=[];
  EMP.forEach(e=>{
    const m=empWeekMin(e.id,w);if(!m&&!S.absences.some(a=>a.emp===e.id&&a.w===w))return;
    const c=e.contrat*60;
    const credit=S.absences.filter(a=>a.emp===e.id&&a.w===w&&['cp','maladie','formation'].includes(a.type)).length*c/5;
    if(e.contrat>=35&&m>c+30)A.push({tone:'warn',k:'heuresSup',emp:e.id,t:`${e.prenom} : ${dur(m)} planifiées pour ${e.contrat} h au contrat`,s:`${dur(m-c)} d’heures sup en plus à payer cette semaine.`});
    if(e.contrat<35&&m>c){const lim=c/10;A.push({tone:m-c>lim?'bad':'warn',k:'complementaires',emp:e.id,t:`${e.prenom} (temps partiel ${e.contrat} h) : ${dur(m-c)} complémentaires`,s:m-c>lim?`Au-delà du 1/10e autorisé (${dur(lim)}). Enlève une coupure ou fais un avenant.`:'Dans la limite du 1/10e du contrat.'});}
    if(m+credit<c-60)A.push({tone:'info',k:'sous',emp:e.id,t:`${e.prenom} : ${dur(m+credit)} planifiées`,s:`Il manque ${dur(c-m-credit)} pour atteindre son contrat de ${e.contrat} h.`});
    for(let d=0;d<7;d++){
      const sh=empShifts(e.id,w,d);if(!sh.length)continue;
      const tot=sum(sh,durMin);
      if(tot>660)A.push({tone:'bad',k:'repos',emp:e.id,t:`${e.prenom} : ${dur(tot)} de travail le ${JOURS[d].toLowerCase()}`,s:'Au-delà de 11 h de travail sur la journée.'});
      sh.forEach(x=>{if(durMin(x)+(x.p||0)>360&&!x.p)A.push({tone:'warn',k:'pause',emp:e.id,t:`${e.prenom} : ${x.s}–${x.e} sans pause (${JOURS[d].toLowerCase()})`,s:'Plus de 6 h d’affilée : 20 min de pause obligatoires.'});});
      let pw=w,pd=d-1;if(pd<0){pd=6;pw=w-1;}
      const prev=empShifts(e.id,pw,pd);
      if(prev.length){
        const lastEnd=Math.max(...prev.map(eMin));
        const rest=(1440-lastEnd)+sMin(sh[0]);
        if(rest<660)A.push({tone:'bad',k:'repos',emp:e.id,t:`${e.prenom} : ${dur(rest)} de repos entre ${JOURS[pd].toLowerCase()} et ${JOURS[d].toLowerCase()}`,s:`Fin à ${hhmm(lastEnd)}, reprise à ${sh[0].s}. Il faut 11 h de repos minimum.`});
      }
    }
  });
  for(let d=0;d<7;d++){
    if(!shiftsWD(w,d).length)continue;
    coverage(w,d).forEach(cv=>{
      cv.miss.forEach(k=>{
        const lab={salle:'en salle',cuisine:'en cuisine',bar:'au bar'}[k];
        A.push({tone:'warn',k:'couverture',d,t:`${JOURS[d]} ${cv.svc} : ${cv.have[k]} personne${cv.have[k]>1?'s':''} ${lab} pour ${cv.cv} couverts`,s:`Il en faudrait ${cv.need[k]} au coup de feu.`});
      });
    });
  }
  const order={bad:0,warn:1,info:2};
  return A.sort((a,b)=>order[a.tone]-order[b.tone]);
}

function evsOn(emp,iso){return (S.pointages[emp]&&S.pointages[emp][iso])||[];}
function ensureEv(emp,iso=TODAY_ISO){S.pointages[emp]=S.pointages[emp]||{};S.pointages[emp][iso]=S.pointages[emp][iso]||[];return S.pointages[emp][iso];}
const todayShifts=emp=>empShifts(emp,0,TIDX);
function workedMin(ev,live){
  let tot=0,open=null;
  ev.forEach(e=>{
    if(e.t==='in'||e.t==='back')open=e.m;
    else if((e.t==='pause'||e.t==='out')&&open!=null){tot+=e.m-open;open=null;}
  });
  if(open!=null&&live)tot+=Math.max(0,nowMin()-open);
  return tot;
}
function presence(emp){
  const sh=todayShifts(emp),ev=evsOn(emp,TODAY_ISO),now=nowMin();
  const last=ev[ev.length-1];
  const ab=absOf(emp,0,TIDX);
  if(last&&(last.t==='in'||last.t==='back')){
    const since=[...ev].reverse().find(x=>x.t==='in');
    return {k:'present',tone:'ok',l:'Présent',d:'depuis '+hhmm(since?since.m:last.m)};
  }
  if(last&&last.t==='pause')return {k:'pause',tone:'info',l:'En pause',d:'depuis '+hhmm(last.m)};
  if(!sh.length)return ab?{k:'absent',tone:'',l:ABS[ab.type],d:ab.note||''}:{k:'off',tone:'',l:'Repos',d:''};
  const nIn=ev.filter(x=>x.t==='in').length;
  const next=sh[nIn];
  if(!next)return {k:'gone',tone:'',l:'Parti',d:last?'à '+hhmm(last.m):''};
  const st=sMin(next);
  if(now>=eMin(next))return {k:'missed',tone:'bad',l:'Non pointé',d:'service '+next.s+'–'+next.e};
  if(now>=st+5)return {k:'late',tone:'bad',l:'En retard',d:durShort(now-st)+' de retard · prévu '+next.s,mins:now-st};
  if(now>=st-15)return {k:'due',tone:'warn',l:'Attendu',d:'prévu '+next.s};
  if(nIn>0)return {k:'coupure',tone:'',l:'En coupure',d:'reprend à '+next.s};
  return {k:'soon',tone:'',l:'À venir',d:'à '+next.s};
}
function nextActions(emp){const ev=evsOn(emp,TODAY_ISO);const last=ev[ev.length-1];if(!last||last.t==='out')return ['in'];if(last.t==='pause')return ['back'];return ['pause','out'];}
const PT={in:{l:'Pointer mon arrivée',s:'Arrivée',ic:'in'},pause:{l:'Commencer ma pause',s:'Début de pause',ic:'pause'},back:{l:'Reprendre le service',s:'Fin de pause',ic:'play'},out:{l:'Pointer mon départ',s:'Départ',ic:'out'}};
function lateCount7(emp){
  let n=0;
  for(let k=0;k<=7;k++){
    const date=addDays(TODAY,-k);const {w,d}=wdOf(date);
    const sh=empShifts(emp,w,d);const ev=evsOn(emp,isoD(date)).filter(x=>x.t==='in');
    sh.forEach((x,i)=>{if(ev[i]&&ev[i].m>sMin(x)+5)n++;});

function unitPrice(c,depth=0){if(c.k==='i')return (ING(c.id)||{}).p||0;const p=REC(c.id);if(!p||depth>3)return 0;return recipeTotal(p,depth+1)/(p.yq||1);}

function allergensOf(r,depth=0){
  const set=new Set(r.extraA||[]);
  r.comps.forEach(c=>{
    if(c.k==='i')((ING(c.id)||{}).a||[]).forEach(a=>set.add(a));
    else{const p=REC(c.id);if(p&&depth<3)allergensOf(p,depth+1).forEach(a=>set.add(a));}
  });
  return Object.keys(ALLERG).filter(a=>set.has(a));
}
function metrics(r,pvOverride){
  const total=recipeTotal(r);
  const por=r.t==='prep'?(r.yq||1):(r.por||1);
  const cost=total/por;
  const pv=pvOverride!=null?pvOverride:(r.pv||0);
  const tva=(r.tva!=null?r.tva:10)/100;
  const pvht=pv/(1+tva);
  const ratio=pvht>0?cost/pvht:0;
  const coef=cost>0?pvht/cost:0;
  return {total,cost,pv,pvht,tva,ratio,coef,marge:pvht-cost};
}
function ratioTone(r){const t=S.target;return r<=t+0.0005?'ok':r<=0.33?'warn':'bad';}
function suggestPrice(cost,target,tva){const raw=cost/target*(1+tva);return Math.ceil(raw*2)/2;}
function usesIng(r,ingId,depth=0){return r.comps.some(c=>c.k==='i'?c.id===ingId:(depth<3&&REC(c.id)&&usesIng(REC(c.id),ingId,depth+1)));}
function menuClasses(){
  const res={};
  rcats().forEach(t=>{
    const items=S.recipes.filter(r=>r.t===t&&r.sales>0);if(items.length<3)return;
    const tot=sum(items,r=>r.sales);const popT=0.7/items.length;
    const mAvg=sum(items,r=>metrics(r).marge*r.sales)/tot;
    items.forEach(r=>{const pop=r.sales/tot>=popT,mar=metrics(r).marge>=mAvg;res[r.id]=pop&&mar?'star':pop?'plow':mar?'puzzle':'dog';});
  });
  return res;
}
const ME={star:{l:'Star',tone:'ok',d:'Populaire et rentable'},plow:{l:'Cheval de labour',tone:'info',d:'Populaire, marge faible'},puzzle:{l:'Énigme',tone:'warn',d:'Rentable, peu vendu'},dog:{l:'Poids mort',tone:'bad',d:'Ni l’un ni l’autre'}};
function weightedFC(){
  const it=S.recipes.filter(r=>r.t!=='prep'&&r.sales>0);
  const c=sum(it,r=>metrics(r).cost*r.sales),v=sum(it,r=>metrics(r).pvht*r.sales);
  return v?c/v:0;
}
function qtyFmt(q,u){
  if(u==='kg')return q<1?nf(q*1000,q*1000%1?1:0)+' g':nf(q,q%1?2:0)+' kg';
  if(u==='L')return q<1?nf(q*100,q*100%1?1:0)+' cl':nf(q,q%1?2:0)+' L';
  if(u==='botte')return nf(q,q%1?2:0)+' botte'+(q>1?'s':'');
  return nf(q,q%1?2:0)+' pc';
}
const unitShort=u=>u==='pièce'?'pc':u;
function stockStatus(i){if(i.noStock||(!i.mn&&!i.par))return null;if(i.st<=0)return {k:'rupture',tone:'bad',l:'Rupture'};if(i.st<i.mn)return {k:'bas',tone:'warn',l:'Sous le seuil'};return {k:'ok',tone:'ok',l:'OK'};}
function portionsLeft(ing){
  let best=null;
  S.recipes.filter(r=>r.t!=='prep'&&r.sales>0).forEach(r=>{
    const c=r.comps.find(c=>c.k==='i'&&c.id===ing.id);if(!c)return;
    const per=compGross(c)/(r.por||1);
    if(!best||r.sales>best.r.sales)best={r,n:Math.floor(ing.st/per)};
  });
  return best;
}

function pinPadHTML(){
  const keys=['1','2','3','4','5','6','7','8','9'];
  return `<div class="pin-dots" id="pin-dots" aria-live="polite">${[0,1,2,3].map(()=>'<span></span>').join('')}</div><div class="pin-err" id="pin-err"></div>
  <div class="pin-pad" id="pin-pad">${keys.map(k=>`<button class="key" data-act="pin-key" data-k="${k}">${k}</button>`).join('')}<button class="key small" data-act="pin-key" data-k="C">Effacer</button><button class="key" data-act="pin-key" data-k="0">0</button><button class="key small" data-act="pin-key" data-k="B" aria-label="Retour">⌫</button></div>`;
}
function pinUI(err){
  const d=$('#pin-dots');if(!d)return;
  d.innerHTML=[0,1,2,3].map(i=>`<span class="${i<PIN.buf.length?'on':''}"></span>`).join('');
  const e=$('#pin-err');if(e)e.textContent=err||'';
}
function pinKey(k){
  if(!PIN.ctx)return;
  if(k==='B')PIN.buf=PIN.buf.slice(0,-1);else if(k==='C')PIN.buf='';else if(PIN.buf.length<4)PIN.buf+=k;
  pinUI();
  if(PIN.buf.length===4)setTimeout(pinCheck,130);
}
function pinFail(msg){const pad=$('#pin-dots');if(pad){pad.classList.remove('shake');void pad.offsetWidth;pad.classList.add('shake');}PIN.buf='';pinUI(msg);}
function pinCheck(){
  const code=PIN.buf;
  if(PIN.ctx==='lock'){
    if(!NET.config)return pinFail('Connexion aux données en cours, réessaie dans un instant.');
    const r=routeCode(code);
    if(!r)return pinFail('Code inconnu.');
    PIN.buf='';PIN.ctx=null;loginAs(r);return;
  }
  if(PIN.ctx==='modal'){
    if(!PIN.expect(code))return pinFail('Ce n’est pas le bon code.');
    const f=PIN.onOk;PIN.buf='';closeModal();f&&f(code);
  }
}
function askPin({title,sub,expect,onOk,hint}){
  PIN.buf='';PIN.ctx='modal';PIN.expect=expect;PIN.onOk=onOk;
  openModal(`<div style="text-align:center"><h3>${title}</h3><p class="muted" style="margin-top:4px">${sub}</p>${pinPadHTML()}${hint?`<p class="faint" style="font-size:12.5px;margin-top:12px">${hint}</p>`:''}<div class="mf" style="justify-content:center"><button class="btn ghost" data-act="modal-close">Annuler</button></div></div>`,'narrow');
}

function leonAlerts(){
  const A=[];const can=CAN();
  EMP.forEach(e=>{
    const st=presence(e.id);
    if(st.k==='missed')A.push({tone:'warn',ic:'clock',t:`${e.prenom} n’a pas pointé son service`,s:`${st.d.charAt(0).toUpperCase()+st.d.slice(1)}. Oubli ou absence ? Corrige pour que le relevé d’heures soit juste.`,acts:[{l:'Corriger',act:'point-for',id:e.id}]});
    if(st.k==='late'&&st.mins>=30){const n=lateCount7(e.id);A.push({tone:'bad',ic:'clock',t:`${e.prenom} n’a pas pointé`,s:`${st.d.charAt(0).toUpperCase()+st.d.slice(1)}.${n>=1?` ${n+1}e retard en 7 jours.`:''}`,acts:[{l:'Appeler',act:'call',id:e.id,ic:'phone'},{l:'Pointer pour lui',act:'point-for',id:e.id}]});}
  });
  S.recipes.filter(r=>r.t!=='prep'&&S.dispo[r.id]&&(S.dispo[r.id].off||S.dispo[r.id].n===0)).slice(0,2).forEach(r=>A.push({tone:'warn',ic:'flame',t:`${r.n} : épuisé`,s:dispoBy(r.id)?dispoBy(r.id).charAt(0).toUpperCase()+dispoBy(r.id).slice(1)+'.':'Retiré de la vente sur toutes les tablettes.',acts:[{l:'Ardoise',act:'nav',v:'service'}]}));
  S.requests.filter(r=>r.status==='pending').forEach(r=>{
    const e=empById(r.emp);
    A.push({tone:'info',ic:'calendar',t:`${e.prenom} demande ${r.type==='cp'?'des congés':'une absence'}`,s:`Du ${shortDate(pdate(r.from))} au ${shortDate(pdate(r.to))}${r.note?' · « '+esc(r.note)+' »':''}`,acts:[{l:'Accepter',act:'req-ok',id:r.id,primary:true},{l:'Refuser',act:'req-no',id:r.id}]});
  });
  S.ingredients.filter(i=>{const s=stockStatus(i);return s&&s.k!=='ok';}).sort((a,b)=>a.st/a.mn-b.st/b.mn).slice(0,2).forEach(i=>{
    const pl=portionsLeft(i);
    A.push({tone:'warn',ic:'box',t:`${i.n} : ${qtyFmt(i.st,i.u)} en stock`,s:`Seuil ${qtyFmt(i.mn,i.u)}.${pl?` De quoi faire ≈ ${pl.n} ${pl.r.n.toLowerCase()}.`:''}`,acts:[{l:'Préparer la commande',act:'goto-orders'}]});
  });
  const bad=planAlerts(0).filter(a=>a.tone==='bad'||a.k==='couverture');
  if(bad.length)A.push({tone:bad[0].tone,ic:'calendar',t:bad[0].t,s:bad[0].s+(bad.length>1?` Et ${bad.length-1} autre${bad.length>2?'s':''} point${bad.length>2?'s':''} dans le planning.`:''),acts:[{l:'Ouvrir le planning',act:'goto-plan',w:0}]});
  if(!S.published['1']&&S.shifts.some(x=>x.w===1)){const n=planAlerts(1).filter(a=>a.tone!=='info').length;A.push({tone:'brass',ic:'calendar',t:`Planning semaine ${isoWeek(dateAt(1,0))} en brouillon`,s:`${n} point${n>1?'s':''} à régler avant de le publier à l’équipe.`,acts:[{l:'Voir',act:'goto-plan',w:1}]});}
  if(can.costs){
    const worst=S.recipes.filter(r=>r.t!=='prep'&&r.pv).map(r=>({r,m:metrics(r)})).filter(o=>ratioTone(o.m.ratio)==='bad').sort((a,b)=>b.m.ratio-a.m.ratio)[0];
    if(worst)A.push({tone:'warn',ic:'chef',t:`${worst.r.n} : ${pc(worst.m.ratio)} de ratio matière`,s:`Objectif ${pc(S.target,0)}. Prix conseillé : ${eur(suggestPrice(worst.m.cost,S.target,worst.m.tva))} (aujourd’hui ${eur(worst.r.pv)}).`,acts:[{l:'Voir la fiche',act:'goto-rec',id:worst.r.id}]});
  }
  if(can.salaries){
    let hi=null;for(let d=0;d<7;d++){if(!dayCA(d))continue;const r=dayCost(0,d)/dayCA(d);if(!hi||r>hi.r)hi={d,r};}
    if(hi&&hi.r>0.34)A.push({tone:'warn',ic:'euro',t:`${JOURS[hi.d]} : masse salariale à ${pc(hi.r,0)} du CA prévu`,s:`${eur(dayCost(0,hi.d),0)} d’heures pour ${eur(dayCA(hi.d),0)} de CA. Un shift de moins suffirait.`,acts:[{l:'Voir le jour',act:'goto-day',d:hi.d}]});
  }
  return A.concat(extraAlerts());
}

     ${A.length?`<div class="alerts">${shown.map(a=>`<div class="al"><span class="ico ${a.tone}">${ic(a.tone==='info'?'clock':'alert','s')}</span><div><b>${esc(a.t)}</b><p>${esc(a.s)}</p></div><div class="acts">${infoBtn(a.k)}</div></div>`).join('')}</div>${A.length>4?`<div style="padding:0 16px 12px"><button class="btn ghost sm" data-act="plan-alerts-all">${UI.plan.allAlerts?'Réduire':`Voir les ${A.length} points`}</button></div>`:''}`:''}</section>`;
  }

function weekGrid(w){

    if(P.filter!=='all'&&P.filter!==po)return;

    emps.forEach(e=>{
      const m=empWeekMin(e.id,w),c=e.contrat*60;const credit=S.absences.filter(a=>a.emp===e.id&&a.w===w&&['cp','maladie','formation'].includes(a.type)).length*c/5;
      const tone=m>c+30?(e.contrat<35&&m-c>c/10?'bad':'warn'):(m+credit<c-60?'info':'');
      body+=`<tr class="${staff&&e.id===U.empId?'me':''}"><td class="ec"><div class="erow">${avatar(e)}<div class="nm"><b>${esc(e.prenom)} ${esc(e.nom[0])}.${staff&&e.id===U.empId?' <span class="new-tag">moi</span>':''}</b><small>${esc(e.titre)}</small><div class="hrs"><span class="tnum">${dur(m)} / ${e.contrat}h</span><span class="bar"><i class="${tone}" style="width:${clamp(m/c*100,0,100)}%"></i></span></div></div></div></td>`;
      days.forEach(d=>{
        if(isClosed(d)){body+=`<td class="cell closed"></td>`;return;}

        let inner='';

        sh.forEach((x,i)=>{
          let dotc='';

          inner+=`<${edit?'button':'div'} class="shift" data-poste="${x.poste}" ${edit?`data-act="shift-edit" data-id="${x.id}" draggable="true" data-drag="${x.id}"`:''} title="${x.s}–${x.e}${x.p?' · pause '+x.p+' min':''} · ${POSTES[x.poste].l}">${dotc}<span class="t">${x.s}–${x.e}</span><span class="m">${dur(durMin(x))}${x.p?' · pause '+x.p+'′':''}${x.poste!==e.poste?' · '+POSTES[x.poste].l:''}</span></${edit?'button':'div'}>`;
        });
        if(edit)inner+=`<button class="add-slot" data-act="shift-new" data-emp="${e.id}" data-d="${d}" aria-label="Ajouter un shift pour ${esc(e.prenom)} le ${JOURS[d].toLowerCase()}">${ic('plus','s')}</button>`;
        body+=`<td class="cell ${today?'today':''}" data-cell="1" data-emp="${e.id}" data-d="${d}">${inner}</td>`;
      });
      body+='</tr>';
    });
  });
  const foot=[];
  foot.push(`<tr><td class="ec">Heures planifiées</td>${days.map(d=>isClosed(d)?'<td class="closed"></td>':`<td><span class="ft-v">${dur(dayHours(w,d))}</span></td>`).join('')}</tr>`);
  foot.push(`<tr><td class="ec"><span class="row" style="gap:6px">Couverture ${infoBtn('couverture')}</span></td>${days.map(d=>{if(isClosed(d))return '<td class="closed"></td>';const cv=coverage(w,d);return `<td><div class="cov">${cv.map(c=>c.miss.length?`<span class="warn">${ic('alert','s')}${c.svc==='midi'?'Midi':'Soir'} : ${c.miss.map(k=>({salle:'salle',cuisine:'cuis.',bar:'bar'}[k])+' '+c.have[k]+'/'+c.need[k]).join(', ')}</span>`:`<span class="ok">${ic('check','s')}${c.svc==='midi'?'Midi':'Soir'}</span>`).join('')}</div></td>`;}).join('')}</tr>`);
  if(can.salaries){
    foot.push(`<tr><td class="ec"><span class="row" style="gap:6px">Masse salariale ${infoBtn('masse')}</span></td>${days.map(d=>{if(isClosed(d))return '<td class="closed"></td>';const c=dayCost(w,d),ca=dayCA(d),r=ca?c/ca:0;return `<td><span class="ft-v">${eur(c,0)}</span><div class="ft-s"><span class="pill ${r<=0.32?'ok':r<=0.36?'warn':'bad'}" style="font-size:11px;padding:.05rem .4rem">${pc(r,0)} du CA</span></div></td>`;}).join('')}</tr>`);
    foot.push(`<tr><td class="ec">CA prévu (HT)</td>${days.map(d=>isClosed(d)?'<td class="closed"></td>':`<td><span class="ft-v">${eur(dayCA(d),0)}</span></td>`).join('')}</tr>`);
  }
